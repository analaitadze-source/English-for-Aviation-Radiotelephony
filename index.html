<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviation RTF & ICAO Phraseology Masterclass</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0f19;
            color: #e2e8f0;
        }
        
        .font-cockpit {
            font-family: 'Chakra Petch', monospace;
        }

        .perspective-1000 {
            perspective: 1000px;
        }

        .transform-style-3d {
            transform-style: preserve-3d;
        }

        .backface-hidden {
            backface-visibility: hidden;
        }

        .rotate-y-180 {
            transform: rotateY(180deg);
        }

        .glow-amber {
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.25);
        }

        .glow-cyan {
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.25);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-cyan-500 selection:text-slate-900">

    <!-- Header Navigation -->
    <header class="bg-slate-900/90 border-b border-slate-800 sticky top-0 z-50 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center space-x-3">
                <div class="bg-cyan-500/10 border border-cyan-500/30 p-2.5 rounded-lg text-cyan-400">
                    <i class="fa-solid fa-plane-departure text-xl"></i>
                </div>
                <div>
                    <h1 class="font-cockpit font-bold text-lg md:text-xl text-slate-100 tracking-wide uppercase">
                        ICAO RTF <span class="text-cyan-400">Masterclass</span>
                    </h1>
                    <p class="text-xs text-slate-400">Radiotelephony Phraseology & Speech Synthesizer</p>
                </div>
            </div>

            <!-- Voice Controls & Navigation -->
            <div class="flex items-center space-x-3">
                <!-- Voice Selector -->
                <div class="flex items-center space-x-2 bg-slate-800 border border-slate-700 px-3 py-1.5 rounded-lg text-xs">
                    <i class="fa-solid fa-microphone text-cyan-400"></i>
                    <select id="voiceSelect" class="bg-transparent text-slate-200 outline-none cursor-pointer max-w-[140px] md:max-w-[180px] truncate">
                        <option value="">Loading Voices...</option>
                    </select>
                </div>

                <!-- Navigation Tabs -->
                <nav class="flex bg-slate-950 p-1 rounded-lg border border-slate-800 text-xs font-medium">
                    <button id="tabFlashcards" onclick="switchTab('flashcards')" class="px-3 py-1.5 rounded-md bg-cyan-500 text-slate-950 font-semibold transition-all">
                        <i class="fa-solid fa-layer-group mr-1.5"></i>Cards
                    </button>
                    <button id="tabMatching" onclick="switchTab('matching')" class="px-3 py-1.5 rounded-md text-slate-400 hover:text-slate-200 transition-all">
                        <i class="fa-solid fa-[#0b0f19] fa-puzzle-piece mr-1.5"></i>Match
                    </button>
                    <button id="tabGapFill" onclick="switchTab('gapfill')" class="px-3 py-1.5 rounded-md text-slate-400 hover:text-slate-200 transition-all">
                        <i class="fa-solid fa-pen-to-square mr-1.5"></i>Fill-In
                    </button>
                </nav>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full">

        <!-- CATEGORY & SEARCH BAR (FLASHCARDS TAB) -->
        <section id="flashcardsView" class="space-y-6">
            <div class="flex flex-col md:flex-row justify-between items-stretch md:items-center gap-4 bg-slate-900/60 border border-slate-800 p-4 rounded-xl">
                <!-- Category Selector -->
                <div class="flex items-center space-x-2 overflow-x-auto pb-2 md:pb-0 scrollbar-none">
                    <button onclick="filterCategory('ALL')" class="cat-btn active border border-cyan-500/50 bg-cyan-500/10 text-cyan-400 px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition-all">
                        All Categories (60+)
                    </button>
                    <button onclick="filterCategory('EMERGENCY')" class="cat-btn border border-slate-700 bg-slate-800/50 text-slate-300 hover:border-slate-600 px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition-all">
                        Emergency & Urgency
                    </button>
                    <button onclick="filterCategory('CLEARANCE')" class="cat-btn border border-slate-700 bg-slate-800/50 text-slate-300 hover:border-slate-600 px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition-all">
                        ATC Clearances
                    </button>
                    <button onclick="filterCategory('WEATHER')" class="cat-btn border border-slate-700 bg-slate-800/50 text-slate-300 hover:border-slate-600 px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition-all">
                        Weather & Aerodrome
                    </button>
                </div>

                <!-- Search -->
                <div class="relative w-full md:w-64">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
                    <input type="text" id="searchInput" onkeyup="handleSearch()" placeholder="Search RTF terms or ICAO codes..." class="w-full bg-slate-950 border border-slate-800 rounded-lg pl-9 pr-3 py-1.5 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:
