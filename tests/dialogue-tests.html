<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Dialogue regression tests</title>
</head>
<body>
  <h1>Dialogue regression tests</h1>
  <pre id="results">Running...</pre>
  <iframe id="app" src="../index.html" hidden></iframe>
  <script>
    async function runTests() {
      if (voicePreparation) await voicePreparation.promise;
      const results = [];
      const assert = (condition, message) => {
        if (!condition) throw new Error(message);
      };
      const test = async (name, fn) => {
        try {
          await fn();
          results.push({ name, passed: true });
        } catch (error) {
          results.push({ name, passed: false, error: error.message });
        }
      };
      const cards = DEFAULT_FLASHCARDS;
      const findCard = id => cards.find(card => card.id === id);
      const newScenarioTitles = [
        'Radio Check and Engine Start', 'Ground Traffic and Readiness', 'Squawk Verification and Correction',
        'Departure and Revised Climb', 'Requested and Revised Descent', 'Traffic Reports and Speed',
        'Unable Heading and Weather Deviation', 'Approach Reports and Tower Go-Around'
      ];
      const additionalScenarioTitles = [
        'Initial Call, IFR Clearance and Pushback', 'Taxi Route and Departure Channel', 'Climb and Speed Reports',
        'Direct Route and Waypoint Spelling', 'Surface Wind and Runway Information',
        'Request an Approach and Report Runway in Sight', 'Taxi to a Parking Stand', 'Further Clearance from Holding'
      ];
      const synthesis = window.speechSynthesis;
      const originalNativeSpeak = synthesis && synthesis.speak;
      const originalActivate = activateAudio;
      const originalSynthesize = synthesizeTurn;
      const originalPlayBuffer = playAudioBuffer;
      const originalControllerVoice = selectedVoice;
      const originalPilotVoice = selectedPilotVoice;
      const originalAlert = window.alert;
      const originalTimeout = window.setTimeout;
      const originalCards = flashcardsData;
      const originalStorage = localStorage.getItem('icao_rtf_cards');
      const category = document.getElementById('flashcard-category');
      const search = document.getElementById('flashcard-search');
      const originalCategory = category.value;
      const originalSearch = search.value;
      const spoken = [];
      const alerts = [];
      let nativeCalls = 0;

      if (synthesis) synthesis.speak = () => { nativeCalls++; };
      activateAudio = () => Promise.resolve({});
      synthesizeTurn = async (text, voice) => [{ text, voice }];
      playAudioBuffer = async buffer => { spoken.push(buffer); };
      window.alert = message => alerts.push(message);

      try {
        await test('Independent American and British voices are selectable', () => {
          const controller = document.getElementById('voice-select');
          const pilot = document.getElementById('pilot-voice-select');
          assert(selectedVoice === 'fast_edwin' && selectedPilotVoice === 'fast_maeve', 'The default controller and pilot voices are not distinct British voices');
          for (const select of [controller, pilot]) {
            const options = [...select.options];
            assert(options.length === 10 && new Set(options.map(option => option.value)).size === 10, 'There must be exactly ten distinct voices');
            assert(options.filter(option => option.textContent.includes('(Male)')).length === 5, 'Five male voices are required');
            assert(options.filter(option => option.textContent.includes('(Female)')).length === 5, 'Five female voices are required');
            assert(options.filter(option => option.textContent.startsWith('American - ')).length === 5, 'American voices are missing');
            assert(options.filter(option => option.textContent.startsWith('British - ')).length === 5, 'British voices are missing');
            assert(options.every(option => !/microsoft|google/i.test(option.textContent)), 'A removed provider voice is present');
          }
          const savedPrepare = prepareVoiceEngine;
          let prepared = 0;
          try {
            prepareVoiceEngine = () => { prepared++; };
            controller.value = 'fast_trevor';
            pilot.value = 'fast_bryony';
            onVoiceChanged();
            assert(selectedVoice === 'fast_trevor' && selectedPilotVoice === 'fast_bryony' && prepared === 1, 'Speaker voice selection or preparation was not applied');
          } finally {
            prepareVoiceEngine = savedPrepare;
          }
          openVoiceSettings();
          assert(!document.getElementById('voice-modal').classList.contains('hidden'), 'Voice settings did not open');
          closeVoiceSettings();
        });

        await test('Independent voice assets are available from the site', async () => {
          const moduleURL = new URL(VOICE_ENGINE_URL, document.baseURI);
          const module = await import(moduleURL.href);
          assert(typeof module.FastVoiceClient === 'function', 'Independent voice module could not be loaded');
          for (const path of ['assets/fast-tts/worker.mjs', 'assets/fast-tts/pdn.mjs', 'assets/fast-tts/pdn.wasm', 'assets/fast-tts/ort.wasm.min.mjs', 'assets/headtts/modules/language-en-us.mjs', 'assets/headtts/modules/language-en-gb.mjs', 'assets/headtts/dictionaries/en-us.txt', 'assets/headtts/dictionaries/en-gb.json']) {
            const response = await fetch(path);
            assert(response.ok && (await response.arrayBuffer()).byteLength > 0, `Voice asset is unavailable: ${path}`);
          }
        });

        await test('British voices use British pronunciations and retain a fallback', async () => {
          const britishModuleURL = new URL('assets/headtts/modules/language-en-gb.mjs', document.baseURI);
          britishModuleURL.search = new URL(VOICE_ENGINE_URL, document.baseURI).search;
          const { Language: BritishLanguage } = await import(britishModuleURL.href);
          const { Language: AmericanLanguage } = await import(new URL('assets/headtts/modules/language-en-us.mjs', document.baseURI).href);
          const british = new BritishLanguage();
          const american = new AmericanLanguage();
          const savedFetch = window.fetch;
          const requested = [];
          try {
            window.fetch = (resource, ...options) => {
              requested.push(String(resource));
              return savedFetch(resource, ...options);
            };
            const [response] = await Promise.all([
              fetch('assets/headtts/dictionaries/en-gb.json'),
              british.loadDictionary('assets/headtts/dictionaries/en-gb.txt'),
              american.loadDictionary('assets/headtts/dictionaries/en-us.txt')
            ]);
            assert(response.ok, 'British pronunciation data is unavailable');
            const lexicon = await response.json();
            assert(british.phonemizeWord('TOWER').join('') === lexicon.tower, 'British voice did not use the British pronunciation');
            assert(british.phonemizeWord('TOWER').join('') !== american.phonemizeWord('TOWER').join(''), 'British and American pronunciations were not distinguished');
            assert(british.phonemizeWord('WIND').join('') === lexicon.wind.DEFAULT, 'A British dictionary entry with alternatives was not handled');
            assert(!lexicon.niner && !lexicon.NINER && british.phonemizeWord('NINER').join('') === american.phonemizeWord('NINER').join(''), 'Unknown words did not use the existing dictionary fallback');
            assert(requested.some(url => url.endsWith(`en-gb.json${britishModuleURL.search}`)), 'British pronunciation data did not inherit the cache version');
          } finally {
            window.fetch = savedFetch;
          }
        });

        await test('All ten fast voices produce local non-silent audio', async () => {
          const { FastVoiceClient } = await import(new URL(VOICE_ENGINE_URL, document.baseURI).href);
          const client = new FastVoiceClient();
          const context = new OfflineAudioContext(1, 1, 24000);
          try {
            let failure;
            try {
              await client.preload('missing-voice');
            } catch (error) {
              failure = error.message;
            }
            assert(/unknown fast voice/i.test(failure), 'An invalid voice was not reported');
            for (const voice of INDEPENDENT_VOICES) {
              const chunks = await withVoiceTimeout(client.synthesize('Tower, request taxi.', voice.id, context), 30000);
              assert(chunks.length && chunks.some(chunk => chunk.getChannelData(0).some(sample => Math.abs(sample) > 0.001)), `${voice.name} produced no audible samples`);
            }
            let staleChunks = 0;
            const stale = client.synthesize('A cancelled transmission.', 'fast_edwin', context, () => { staleChunks++; });
            client.clear();
            assert((await stale).length === 0 && staleChunks === 0, 'Cancelled worker audio was delivered');
            const fresh = await withVoiceTimeout(client.synthesize('A new transmission.', 'fast_edwin', context), 30000);
            assert(fresh.length > 0, 'The worker did not recover after cancellation');
          } finally {
            client.close();
          }
        });

        await test('Voice preparation respects reduced-data connections', async () => {
          assert(shouldPrepareVoice(null), 'A normal connection should prepare voices');
          assert(!shouldPrepareVoice({ saveData: true, effectiveType: '4g' }), 'Data saver should defer voice preparation');
          assert(!shouldPrepareVoice({ saveData: false, effectiveType: '2g' }), 'A slow connection should defer voice preparation');
          const savedActivate = activateAudio;
          const savedGetEngine = getVoiceEngine;
          const savedShouldPrepare = shouldPrepareVoice;
          const savedEngine = voiceEngine;
          const savedPromise = voiceEnginePromise;
          const savedPreparation = voicePreparation;
          const savedBusy = voiceBusy;
          let starts = 0;
          let activations = 0;
          const preloaded = [];
          try {
            voiceEngine = null;
            voiceEnginePromise = null;
            voicePreparation = null;
            voiceBusy = false;
            activateAudio = () => { activations++; return Promise.resolve({}); };
            getVoiceEngine = async () => {
              starts++;
              return {
                preload: async voice => { preloaded.push(voice); },
                synthesize: async () => [{}]
              };
            };
            shouldPrepareVoice = () => false;
            prepareVoiceEngine();
            assert(starts === 0, 'Preparation started on a reduced-data connection');
            await originalSynthesize('REDUCED DATA REQUEST', selectedVoice, {}, playbackGeneration, 'controller');
            assert(starts === 1 && preloaded.includes(selectedVoice), 'An explicit audio request did not start on a reduced-data connection');
            starts = 0;
            preloaded.length = 0;
            shouldPrepareVoice = () => true;
            const first = prepareVoiceEngine();
            prepareVoiceEngine();
            await first;
            assert(starts === 1 && !voicePreparation, 'Repeated interactions started duplicate voice preparation');
            assert(new Set(preloaded).size === 2 && preloaded.includes(selectedVoice) && preloaded.includes(selectedPilotVoice), 'Both selected voices were not prepared');
            assert(activations === 0, 'Background preparation attempted to start playback');
            assert(/voices are ready/i.test(document.getElementById('voice-feedback').textContent), 'Voice readiness was not displayed');
          } finally {
            activateAudio = savedActivate;
            getVoiceEngine = savedGetEngine;
            shouldPrepareVoice = savedShouldPrepare;
            voiceEngine = savedEngine;
            voiceEnginePromise = savedPromise;
            voicePreparation = savedPreparation;
            voiceBusy = savedBusy;
          }
        });

        await test('Opening a card or scenario starts voice preparation', () => {
          const savedPrepare = prepareVoiceEngine;
          let starts = 0;
          try {
            prepareVoiceEngine = () => { starts++; };
            renderFlashcards([findCard(1)]);
            const card = document.querySelector('#flashcards-grid .flip-card-inner');
            card.click();
            card.click();
            document.getElementById('mtab-scenarios').click();
            assert(starts === 2, 'Voice preparation did not follow card and scenario interactions');
          } finally {
            prepareVoiceEngine = savedPrepare;
            switchTab('flashcards');
          }
        });

        await test('Likely card and scenario audio is prepared without playing it', async () => {
          const savedEngine = voiceEngine;
          const savedBusy = voiceBusy;
          const savedSynthesize = synthesizeTurn;
          const savedTimeout = window.setTimeout;
          const savedPrepare = prepareVoiceEngine;
          const prepared = [];
          let preparation;
          try {
            voiceEngine = {};
            voiceBusy = false;
            prepareVoiceEngine = () => Promise.resolve();
            synthesizeTurn = async (text, voice) => { prepared.push({ text, voice }); return []; };
            window.setTimeout = callback => { preparation = callback(); return 0; };
            renderFlashcards([findCard(5)]);
            document.querySelector('#flashcards-grid .flip-card-inner').click();
            await preparation;
            assert(prepared.length === 2 && prepared[0].text === convertTextToICAOSpeech(findCard(5).icaoAudio), 'Card phrase was not prepared');
            assert(prepared[1].text === convertTextToICAOSpeech(findCard(5).pilotLine) && prepared[1].voice === selectedPilotVoice, 'First dialogue speaker was not prepared with the selected voice');
            prepared.length = 0;
            switchTab('scenarios');
            prepared.length = 0;
            loadScenario(0);
            await preparation;
            assert(prepared.length === 1 && prepared[0].voice === selectedPilotVoice && prepared[0].text === convertTextToICAOSpeech(SCENARIOS[0].lines[0].text), 'Scenario line was not prepared with its speaker voice');
          } finally {
            speechPreparationRevision++;
            voiceEngine = savedEngine;
            voiceBusy = savedBusy;
            synthesizeTurn = savedSynthesize;
            window.setTimeout = savedTimeout;
            prepareVoiceEngine = savedPrepare;
            switchTab('flashcards');
          }
        });

        await test('Playback reuses matching speech already being prepared', async () => {
          const savedEngine = voiceEngine;
          const savedBusy = voiceBusy;
          const savedSynthesize = synthesizeTurn;
          const savedTimeout = window.setTimeout;
          const savedBackground = backgroundSpeech;
          let preparation;
          let release;
          let calls = 0;
          let clears = 0;
          try {
            voiceEngine = { clear: () => { clears++; } };
            voiceBusy = false;
            window.setTimeout = callback => { preparation = callback(); return 0; };
            synthesizeTurn = (text, voice) => {
              calls++;
              return new Promise(resolve => { release = () => resolve([{ text, voice }]); });
            };
            spoken.length = 0;
            prepareLikelySpeech([{ speaker: 'ATC', text: 'TEST' }], () => true);
            assert(backgroundSpeech && calls === 1, 'Expected speech did not start preparing');
            const playback = speakICAOText('TEST');
            release();
            await playback;
            await preparation;
            assert(calls === 1 && clears === 0 && spoken.length === 1 && spoken[0].text === 'TEST', 'Matching preparation was cancelled or generated twice');
          } finally {
            speechPreparationRevision++;
            voiceEngine = savedEngine;
            voiceBusy = savedBusy;
            synthesizeTurn = savedSynthesize;
            window.setTimeout = savedTimeout;
            backgroundSpeech = savedBackground;
          }
        });

        await test('Generated speech is reused only for the same text and voice', async () => {
          const savedGetEngine = getVoiceEngine;
          const buffer = { length: 10, numberOfChannels: 1, getChannelData: () => new Float32Array(10) };
          let generations = 0;
          try {
            speechCache.clear();
            speechCacheBytes = 0;
            getVoiceEngine = async () => ({
              preload: async () => {},
              synthesize: async () => {
                generations++;
                return [buffer];
              }
            });
            await originalSynthesize('CACHE TEST', 'fast_edwin', {}, playbackGeneration, 'controller');
            await originalSynthesize('CACHE TEST', 'fast_edwin', {}, playbackGeneration, 'controller');
            assert(generations === 1, 'Repeated speech was generated again');
            await originalSynthesize('CACHE TEST', 'fast_maeve', {}, playbackGeneration, 'pilot');
            await originalSynthesize('OTHER TEST', 'fast_edwin', {}, playbackGeneration, 'controller');
            assert(generations === 3, 'Speech cache mixed voices or message text');
            speechCache.clear();
            speechCacheBytes = 0;
            const large = { length: Math.floor(SPEECH_CACHE_LIMIT / 8), numberOfChannels: 1, getChannelData: () => new Float32Array(0) };
            cacheSpeech('FIRST', 'fast_edwin', [large]);
            cacheSpeech('SECOND', 'fast_edwin', [large]);
            cachedSpeech('FIRST', 'fast_edwin');
            cacheSpeech('THIRD', 'fast_edwin', [large]);
            assert(cachedSpeech('FIRST', 'fast_edwin') && !cachedSpeech('SECOND', 'fast_edwin') && speechCacheBytes <= SPEECH_CACHE_LIMIT, 'Speech cache did not evict its least-recently-used entry');
          } finally {
            speechCache.clear();
            speechCacheBytes = 0;
            getVoiceEngine = savedGetEngine;
          }
        });

        await test('Voice status changes from download to generation', async () => {
          const originalGetVoiceEngine = getVoiceEngine;
          let finishPreparation;
          const preparation = new Promise(resolve => { finishPreparation = resolve; });
          try {
            getVoiceEngine = async () => {
              return {
                preload: () => preparation,
                synthesize: async () => [{}]
              };
            };
            const generation = originalSynthesize('TEST', selectedVoice, {}, playbackGeneration, 'controller');
            await new Promise(resolve => setTimeout(resolve, 0));
            assert(/preparing controller voice.*download/i.test(document.getElementById('voice-feedback').textContent), 'Cold voice loading was not distinguished from inference');
            finishPreparation();
            await generation;
            assert(document.getElementById('voice-feedback').textContent.startsWith('Generating controller audio'), 'Preparation status remained after the voice was ready');
          } finally {
            finishPreparation();
            getVoiceEngine = originalGetVoiceEngine;
          }
        });

        await test('Voice client preserves preparation and cancels queued playback', async () => {
          const moduleURL = new URL(VOICE_ENGINE_URL, document.baseURI);
          const { FastVoiceClient } = await import(moduleURL.href);
          const savedWorker = window.Worker;
          let workerURL;
          let clears = 0;
          let terminated = false;
          class FakeWorker {
            constructor(url, options) {
              assert(options.type === 'module', 'Voice worker was not created as a module');
              workerURL = new URL(url);
            }
            postMessage(message) {
              if (message.type === 'preload') {
                queueMicrotask(() => this.onmessage({ data: { type: 'ready', id: message.id } }));
              } else if (message.type === 'clear') {
                clears++;
              }
            }
            terminate() { terminated = true; }
          }
          try {
            window.Worker = FakeWorker;
            const engine = new FastVoiceClient();
            const preparation = engine.preload('fast_edwin');
            const pending = engine.synthesize('TEST', 'fast_edwin', {});
            engine.clear();
            await preparation;
            assert((await pending).length === 0 && clears === 1, 'Clearing speech did not cancel its request');
            assert(workerURL.search === moduleURL.search, 'Voice worker did not inherit the engine cache version');
            engine.close();
            assert(terminated, 'Voice worker was not terminated');
          } finally {
            window.Worker = savedWorker;
          }
        });

        await test('Suspended audio is resumed before playback', async () => {
          let resumed = false;
          let played = false;
          const context = {
            state: 'suspended',
            destination: {},
            resume: async function () { resumed = true; this.state = 'running'; },
            createBufferSource: () => ({
              connect: () => {},
              start() { played = true; queueMicrotask(() => this.onended()); }
            })
          };
          await originalPlayBuffer({}, context, playbackGeneration);
          assert(resumed && played, 'A suspended audio context did not resume and play');
          context.state = 'suspended';
          context.resume = async () => {};
          let failure;
          try {
            await originalPlayBuffer({}, context, playbackGeneration);
          } catch (error) {
            failure = error.message;
          }
          assert(/blocked/i.test(failure), 'Blocked playback was not reported');
        });

        await test('Long local speech streams without truncating phonemes', async () => {
          const { FastVoiceClient } = await import(new URL(VOICE_ENGINE_URL, document.baseURI).href);
          const { Language } = await import(new URL('assets/headtts/modules/language-en-gb.mjs', document.baseURI).href);
          const language = new Language();
          await language.loadDictionary(new URL('assets/headtts/dictionaries/en-gb.txt', document.baseURI).href);
          const sentence = 'Tower, request taxi.';
          const text = `${sentence} `.repeat(32).trim();
          assert(language.generate([{ type: 'text', value: text }]).phonemes.length > 510, 'Long-message test did not exceed the model limit');
          const client = new FastVoiceClient();
          const context = new OfflineAudioContext(1, 1, 24000);
          try {
            const short = await withVoiceTimeout(client.synthesize(sentence, 'fast_edwin', context), 30000);
            let streamed = 0;
            const long = await withVoiceTimeout(client.synthesize(text, 'fast_edwin', context, () => { streamed++; }), 60000);
            const duration = chunks => chunks.reduce((sum, buffer) => sum + buffer.duration, 0);
            assert(streamed === long.length && streamed > 1, 'Long speech was not streamed');
            assert(duration(long) > duration(short) * 10, 'Long speech was truncated at the model limit');
          } finally {
            client.close();
          }
        });

        await test('Rendered dialogue and speech use the same speaker order', async () => {
          const pilotFirst = [5, 7, 15, 31, 40, 42, 44, 51, 52, 54, 69, 70, 75, 77, 92, 93, 99, 100, 101, 105, 106, 108, 112, 117, 121, 124, 125];
          for (const card of cards) {
            const id = card.id;
            renderFlashcards([card]);
            const lines = [...document.querySelectorAll('#flashcards-grid [data-speaker]')];
            assert(lines[0].dataset.speaker === (pilotFirst.includes(id) ? 'PILOT' : 'ATC'), `Wrong first speaker on card ${id}`);
            assert(lines[1].dataset.speaker === (pilotFirst.includes(id) ? 'ATC' : 'PILOT'), `Wrong second speaker on card ${id}`);
            if (id === 6) {
              assert(lines.length === 4 && lines[2].dataset.speaker === 'ATC' && lines[3].dataset.speaker === 'PILOT', 'Say-again exchange is incomplete');
            }
            spoken.length = 0;
            document.querySelector('[data-card-action="dialogue"]').click();
            await activeSpeechTask;
            assert(spoken.length === lines.length, `Audio turn count differs on card ${id}`);
            lines.forEach((line, index) => {
              const text = line.textContent.trim().replace(/^(?:ATC|PILOT):\s*"/, '').replace(/"$/, '');
              assert(spoken[index].text === convertTextToICAOSpeech(text), `Audio order or text differs on card ${id}, turn ${index + 1}`);
              assert(spoken[index].voice === (line.dataset.speaker === 'PILOT' ? selectedPilotVoice : selectedVoice), `Wrong speaker voice on card ${id}`);
            });
          }
        });

        await test('Thirty new phrases are available across the practice sections', () => {
          const added = cards.filter(card => card.id >= 71 && card.id <= 100);
          assert(added.length === 30, 'The previous 30 added cards are missing');
          assert(new Set(cards.map(card => card.id)).size === cards.length, 'Card identifiers are not unique');
          assert(new Set(cards.map(card => card.phrase.toLowerCase())).size === cards.length, 'A practice phrase is duplicated');
          for (let id = 71; id <= 100; id++) {
            const card = findCard(id);
            assert(card && card.meaning && card.icaoAudio && getCardDialogue(card).length >= 2, `Card ${id} is incomplete`);
            assert(card.collocations.length >= 2 && card.compoundNouns.length >= 1, `Card ${id} has no specific vocabulary`);
            const questions = QUIZ_QUESTIONS.filter(question => question.cardId === id);
            assert(questions.length === 1, `Card ${id} does not have exactly one related quiz question`);
            const question = questions[0];
            assert([1, 2, 3].includes(question.difficulty) && question.options.length === 4 &&
              new Set(question.options).size === 4 && Number.isInteger(question.correct) &&
              question.correct >= 0 && question.correct < question.options.length && question.explanation,
              `Card ${id} has an invalid quiz question`);
          }
          assert(newScenarioTitles.every(title => SCENARIOS.some(scenario => scenario.title === title)),
            'The new phrases are not represented in the scenario section');
          const previousCards = flashcardsData;
          const previousCategory = category.value;
          const previousSearch = search.value;
          const vocabularySearch = document.getElementById('vocabulary-search');
          const previousVocabularySearch = vocabularySearch.value;
          try {
            flashcardsData = cards;
            category.value = 'ALL';
            search.value = 'request a weather deviation';
            filterFlashcards();
            assert(document.querySelectorAll('#flashcards-grid .flip-card').length === 1 &&
              document.getElementById('flashcards-grid').textContent.includes('CARD ID: #93'),
              'New card vocabulary is not searchable');
            vocabularySearch.value = '';
            renderVocabularyList();
            for (const card of added) {
              assert(document.querySelector(`#radio-examples [data-card-id="${card.id}"]`),
                `Card ${card.id} is missing from radio examples`);
              const term = card.collocations[0];
              assert([...document.querySelectorAll('#general-examples [data-general-example]')].some(item =>
                item.querySelector('dt').textContent.toLowerCase().includes(term.toLowerCase())),
                `Card ${card.id} has no related general-English example`);
            }
            flashcardsData = added;
            initMatchingDrills();
            assert(matchingRoundPairs.length === 5 && matchingRoundPairs.every(card => card.id >= 71 && card.id <= 100),
              'New cards are not available to matching drills');
          } finally {
            flashcardsData = previousCards;
            category.value = previousCategory;
            search.value = previousSearch;
            vocabularySearch.value = previousVocabularySearch;
            renderVocabularyList();
            filterFlashcards();
          }
        });

        await test('Twenty-five common phrases reach every practice section', () => {
          const added = cards.filter(card => card.id >= 101 && card.id <= 125);
          assert(cards.length === 124 && added.length === 25, 'The built-in deck does not contain exactly 25 new cards');
          assert(new Set(cards.map(card => card.id)).size === cards.length, 'Card identifiers are not unique');
          assert(new Set(cards.map(card => card.phrase.toLowerCase())).size === cards.length, 'A practice phrase is duplicated');
          for (let id = 101; id <= 125; id++) {
            const card = findCard(id);
            assert(card && card.meaning && card.icaoAudio && getCardDialogue(card).length >= 2, `Card ${id} is incomplete`);
            assert(card.collocations.length >= 2 && card.compoundNouns.length >= 1, `Card ${id} lacks related vocabulary`);
            const questions = QUIZ_QUESTIONS.filter(question => question.cardId === id);
            assert(questions.length === 1, `Card ${id} lacks a related quiz question`);
            const question = questions[0];
            assert([1, 2, 3].includes(question.difficulty) && question.options.length === 4 &&
              new Set(question.options).size === 4 && Number.isInteger(question.correct) &&
              question.correct >= 0 && question.correct < question.options.length && question.explanation,
              `Card ${id} has an invalid quiz question`);
          }
          const scenarios = SCENARIOS.filter(scenario => additionalScenarioTitles.includes(scenario.title));
          assert(scenarios.length === additionalScenarioTitles.length, 'A new scenario is missing');
          const scenarioText = scenarios.flatMap(scenario => scenario.lines.map(line => line.text ||

          const site = new URL(property('og:url'));
          const imageURL = new URL(property('og:image'));
          const expectedImage = new URL('assets/radar-preview.png', site);
          assert(site.protocol === 'https:' && imageURL.origin === expectedImage.origin && imageURL.pathname === expectedImage.pathname && imageURL.searchParams.has('v'), 'Share image URL is not absolute, versioned or matched to the site');
          assert(property('og:image:type') === 'image/png' && preview.type.startsWith('image/png'), 'Share image is not a PNG');
          assert(preview.width >= 1200 && preview.height >= 627 && preview.bytes <= 5 * 1024 * 1024, 'Share image does not meet LinkedIn dimensions or size');
          assert(Number(property('og:image:width')) === preview.width && Number(property('og:image:height')) === preview.height, 'Share image metadata dimensions are incorrect');
          assert(/pilot/i.test(property('og:image:alt')) && /headset/i.test(property('og:image:alt')) && /radar/i.test(property('og:image:alt')), 'Share image alternative text is incomplete');
        });

        await test('Page header displays the LinkedIn pilot and radar image', async () => {
          const headerImage = document.querySelector('header img');
          const shareImage = new URL(document.querySelector('meta[property="og:image"]').content);
          const expectedImage = new URL(`assets/radar-preview.png${shareImage.search}`, document.baseURI);
          assert(headerImage && headerImage.src === expectedImage.href, 'Header is not using the versioned share image');
          assert(/pilot/i.test(headerImage.alt) && /headset/i.test(headerImage.alt) && /radar/i.test(headerImage.alt), 'Header image alternative text is incomplete');
          await headerImage.decode();
          assert(headerImage.naturalWidth === preview.width && headerImage.naturalHeight === preview.height, 'Header image could not be decoded');
        });

        await test('Shield logo appears beside the title and in the browser tab', async () => {
          const logo = document.querySelector('header h1 [data-shield-logo]');
          const icon = document.querySelector('link[rel="icon"]');
          const expected = new URL('assets/shield-logo.svg', document.baseURI).href;
          assert(logo && logo.src === expected && /shield/i.test(logo.alt), 'Title shield logo is missing');
          assert(icon && icon.href === expected && icon.type === 'image/svg+xml', 'Browser tab does not use the shield logo');
          await logo.decode();
          assert(logo.naturalWidth > 0 && logo.naturalHeight > 0, 'Shield logo could not be decoded');
        });
      } finally {
        playbackGeneration++;
        if (synthesis) synthesis.speak = originalNativeSpeak;
        activateAudio = originalActivate;
        synthesizeTurn = originalSynthesize;
        playAudioBuffer = originalPlayBuffer;
        selectedVoice = originalControllerVoice;
        selectedPilotVoice = originalPilotVoice;
        populateVoices();
        window.alert = originalAlert;
        window.setTimeout = originalTimeout;
        flashcardsData = originalCards;
        if (originalStorage === null) localStorage.removeItem('icao_rtf_cards');
        else localStorage.setItem('icao_rtf_cards', originalStorage);
        category.value = originalCategory;
        search.value = originalSearch;
        switchTab('flashcards');
        filterFlashcards();
      }
      return results;
    }

    document.getElementById('app').addEventListener('load', async () => {
      const output = document.getElementById('results');
      try {
        const run = document.getElementById('app').contentWindow.eval(`(${runTests.toString()})`);
        const results = await run();
        const failures = results.filter(result => !result.passed);
        output.textContent = results.map(result => `${result.passed ? 'PASS' : 'FAIL'} ${result.name}${result.error ? ': ' + result.error : ''}`).join('\n');
        output.textContent += `\n\n${results.length - failures.length}/${results.length} passed`;
        document.title = failures.length ? 'Dialogue tests failed' : 'Dialogue tests passed';
      } catch (error) {
        output.textContent = `Unable to run tests: ${error.message}`;
        document.title = 'Dialogue tests failed';
      }
    });
  </script>
</body>
</html>
