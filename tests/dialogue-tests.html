<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Dialogue regression tests</title>
</head>
<body>
  <h1>Dialogue regression tests</h1>
  <pre id="results">Running...</pre>
  <iframe id="app" src="../index.html" hidden></iframe>
  <script>
    async function runTests() {
      const results = [];
      const assert = (condition, message) => {
        if (!condition) throw new Error(message);
      };
      const test = async (name, fn) => {
        try {
          await fn();
          results.push({ name, passed: true });
        } catch (error) {
          results.push({ name, passed: false, error: error.message });
        }
      };
      const cards = DEFAULT_FLASHCARDS;
      const findCard = id => cards.find(card => card.id === id);
      const synthesis = window.speechSynthesis;
      const originalNativeSpeak = synthesis && synthesis.speak;
      const originalActivate = activateAudio;
      const originalSynthesize = synthesizeTurn;
      const originalPlayBuffer = playAudioBuffer;
      const originalControllerVoice = selectedVoice;
      const originalPilotVoice = selectedPilotVoice;
      const originalAlert = window.alert;
      const originalTimeout = window.setTimeout;
      const originalCards = flashcardsData;
      const originalStorage = localStorage.getItem('icao_rtf_cards');
      const category = document.getElementById('flashcard-category');
      const search = document.getElementById('flashcard-search');
      const originalCategory = category.value;
      const originalSearch = search.value;
      const spoken = [];
      const alerts = [];
      let nativeCalls = 0;

      if (synthesis) synthesis.speak = () => { nativeCalls++; };
      activateAudio = () => Promise.resolve({});
      synthesizeTurn = async (text, voice) => [{ text, voice }];
      playAudioBuffer = async buffer => { spoken.push(buffer); };
      window.alert = message => alerts.push(message);

      try {
        await test('Independent American and British voices are selectable', () => {
          const controller = document.getElementById('voice-select');
          const pilot = document.getElementById('pilot-voice-select');
          assert(selectedVoice === 'bm_george' && selectedPilotVoice === 'bf_emma', 'The default controller and pilot voices are not distinct British voices');
          for (const select of [controller, pilot]) {
            const options = [...select.options];
            assert(options.length >= 16, 'Independent voice choices are missing');
            assert(options.filter(option => option.textContent.startsWith('American - ')).length >= 8, 'American voices are missing');
            assert(options.filter(option => option.textContent.startsWith('British - ')).length >= 8, 'British voices are missing');
            assert(options.every(option => !/microsoft|google/i.test(option.textContent)), 'A removed provider voice is present');
          }
          controller.value = 'am_michael';
          pilot.value = 'bf_emma';
          onVoiceChanged();
          assert(selectedVoice === 'am_michael' && selectedPilotVoice === 'bf_emma', 'Speaker voice selection was not applied');
          openVoiceSettings();
          assert(!document.getElementById('voice-modal').classList.contains('hidden'), 'Voice settings did not open');
          closeVoiceSettings();
        });

        await test('Independent voice assets are available from the site', async () => {
          const moduleURL = new URL(VOICE_ENGINE_URL, document.baseURI);
          const module = await import(moduleURL.href);
          assert(typeof module.HeadTTS === 'function', 'Independent voice module could not be loaded');
          for (const path of ['assets/headtts/modules/worker-tts.mjs', 'assets/headtts/modules/language-en-us.mjs', 'assets/headtts/modules/language-en-gb.mjs', 'assets/headtts/dictionaries/en-us.txt', 'assets/headtts/dictionaries/en-gb.json']) {
            const response = await fetch(path);
            assert(response.ok && (await response.arrayBuffer()).byteLength > 0, `Voice asset is unavailable: ${path}`);
          }
        });

        await test('British voices use British pronunciations and retain a fallback', async () => {
          const britishModuleURL = new URL('assets/headtts/modules/language-en-gb.mjs', document.baseURI);
          britishModuleURL.search = new URL(VOICE_ENGINE_URL, document.baseURI).search;
          const { Language: BritishLanguage } = await import(britishModuleURL.href);
          const { Language: AmericanLanguage } = await import(new URL('assets/headtts/modules/language-en-us.mjs', document.baseURI).href);
          const british = new BritishLanguage();
          const american = new AmericanLanguage();
          const savedFetch = window.fetch;
          const requested = [];
          try {
            window.fetch = (resource, ...options) => {
              requested.push(String(resource));
              return savedFetch(resource, ...options);
            };
            const [response] = await Promise.all([
              fetch('assets/headtts/dictionaries/en-gb.json'),
              british.loadDictionary('assets/headtts/dictionaries/en-gb.txt'),
              american.loadDictionary('assets/headtts/dictionaries/en-us.txt')
            ]);
            assert(response.ok, 'British pronunciation data is unavailable');
            const lexicon = await response.json();
            assert(british.phonemizeWord('TOWER').join('') === lexicon.tower, 'British voice did not use the British pronunciation');
            assert(british.phonemizeWord('TOWER').join('') !== american.phonemizeWord('TOWER').join(''), 'British and American pronunciations were not distinguished');
            assert(british.phonemizeWord('WIND').join('') === lexicon.wind.DEFAULT, 'A British dictionary entry with alternatives was not handled');
            assert(!lexicon.niner && !lexicon.NINER && british.phonemizeWord('NINER').join('') === american.phonemizeWord('NINER').join(''), 'Unknown words did not use the existing dictionary fallback');
            assert(requested.some(url => url.endsWith(`en-gb.json${britishModuleURL.search}`)), 'British pronunciation data did not inherit the cache version');
          } finally {
            window.fetch = savedFetch;
          }
        });

        await test('Voice selection chooses the matching pronunciation language', async () => {
          const savedGetVoiceEngine = getVoiceEngine;
          const setups = [];
          try {
            getVoiceEngine = async () => ({
              setup: async options => { setups.push(options); },
              synthesize: async () => [{ type: 'audio', data: { audio: {} } }]
            });
            for (const voice of ['bm_george', 'bf_emma', 'af_bella']) {
              await originalSynthesize('TEST', voice, {}, playbackGeneration, 'controller');
            }
            assert(setups.map(setup => setup.language).join(',') === 'en-gb,en-gb,en-us', 'Voice accents did not select the corresponding pronunciation data');
          } finally {
            getVoiceEngine = savedGetVoiceEngine;
          }
        });

        await test('Voice preparation respects reduced-data connections', async () => {
          assert(shouldPrepareVoice(null), 'A normal connection should prepare voices');
          assert(!shouldPrepareVoice({ saveData: true, effectiveType: '4g' }), 'Data saver should defer voice preparation');
          assert(!shouldPrepareVoice({ saveData: false, effectiveType: '2g' }), 'A slow connection should defer voice preparation');
          const savedActivate = activateAudio;
          const savedGetEngine = getVoiceEngine;
          const savedShouldPrepare = shouldPrepareVoice;
          const savedEngine = voiceEngine;
          const savedPromise = voiceEnginePromise;
          const savedBusy = voiceBusy;
          let starts = 0;
          try {
            voiceEngine = null;
            voiceEnginePromise = null;
            voiceBusy = false;
            activateAudio = () => Promise.resolve({});
            getVoiceEngine = async () => { starts++; };
            shouldPrepareVoice = () => false;
            prepareVoiceEngine();
            assert(starts === 0, 'Preparation started on a reduced-data connection');
            shouldPrepareVoice = () => true;
            const first = prepareVoiceEngine();
            prepareVoiceEngine();
            await first;
            assert(starts === 1 && !voicePreparing, 'Repeated interactions started duplicate voice preparation');
            assert(/voices are ready/i.test(document.getElementById('voice-feedback').textContent), 'Voice readiness was not displayed');
          } finally {
            activateAudio = savedActivate;
            getVoiceEngine = savedGetEngine;
            shouldPrepareVoice = savedShouldPrepare;
            voiceEngine = savedEngine;
            voiceEnginePromise = savedPromise;
            voiceBusy = savedBusy;
            voicePreparing = false;
          }
        });

        await test('Opening a card or scenario starts voice preparation', () => {
          const savedPrepare = prepareVoiceEngine;
          let starts = 0;
          try {
            prepareVoiceEngine = () => { starts++; };
            renderFlashcards([findCard(1)]);
            const card = document.querySelector('#flashcards-grid .flip-card-inner');
            card.click();
            card.click();
            document.getElementById('mtab-scenarios').click();
            assert(starts === 2, 'Voice preparation did not follow card and scenario interactions');
          } finally {
            prepareVoiceEngine = savedPrepare;
            switchTab('flashcards');
          }
        });

        await test('Likely card and scenario audio is prepared without playing it', async () => {
          const savedEngine = voiceEngine;
          const savedBackend = voiceEngineBackend;
          const savedBusy = voiceBusy;
          const savedSynthesize = synthesizeTurn;
          const savedTimeout = window.setTimeout;
          const prepared = [];
          let preparation;
          try {
            voiceEngine = { settings: { dtypeWebgpu: 'fp16' } };
            voiceEngineBackend = 'webgpu';
            voiceBusy = false;
            synthesizeTurn = async (text, voice) => { prepared.push({ text, voice }); return []; };
            window.setTimeout = callback => { preparation = callback(); return 0; };
            renderFlashcards([findCard(5)]);
            document.querySelector('#flashcards-grid .flip-card-inner').click();
            await preparation;
            assert(prepared.length === 2 && prepared[0].text === convertTextToICAOSpeech(findCard(5).icaoAudio), 'Card phrase was not prepared');
            assert(prepared[1].text === convertTextToICAOSpeech(findCard(5).pilotLine) && prepared[1].voice === selectedPilotVoice, 'First dialogue speaker was not prepared with the selected voice');
            prepared.length = 0;
            switchTab('scenarios');
            prepared.length = 0;
            loadScenario(0);
            await preparation;
            assert(prepared.length === 1 && prepared[0].voice === selectedPilotVoice && prepared[0].text === convertTextToICAOSpeech(SCENARIOS[0].lines[0].text), 'Scenario line was not prepared with its speaker voice');
          } finally {
            speechPreparationRevision++;
            voiceEngine = savedEngine;
            voiceEngineBackend = savedBackend;
            voiceBusy = savedBusy;
            synthesizeTurn = savedSynthesize;
            window.setTimeout = savedTimeout;
            switchTab('flashcards');
          }
        });

        await test('Playback reuses matching speech already being prepared', async () => {
          const savedEngine = voiceEngine;
          const savedBackend = voiceEngineBackend;
          const savedBusy = voiceBusy;
          const savedSynthesize = synthesizeTurn;
          const savedTimeout = window.setTimeout;
          const savedBackground = backgroundSpeech;
          let preparation;
          let release;
          let calls = 0;
          let clears = 0;
          try {
            voiceEngine = { settings: { dtypeWebgpu: 'fp16' }, clear: () => { clears++; } };
            voiceEngineBackend = 'webgpu';
            voiceBusy = false;
            window.setTimeout = callback => { preparation = callback(); return 0; };
            synthesizeTurn = (text, voice) => {
              calls++;
              return new Promise(resolve => { release = () => resolve([{ text, voice }]); });
            };
            spoken.length = 0;
            prepareLikelySpeech([{ speaker: 'ATC', text: 'TEST' }], () => true);
            assert(backgroundSpeech && calls === 1, 'Expected speech did not start preparing');
            const playback = speakICAOText('TEST');
            release();
            await playback;
            await preparation;
            assert(calls === 1 && clears === 0 && spoken.length === 1 && spoken[0].text === 'TEST', 'Matching preparation was cancelled or generated twice');
          } finally {
            speechPreparationRevision++;
            voiceEngine = savedEngine;
            voiceEngineBackend = savedBackend;
            voiceBusy = savedBusy;
            synthesizeTurn = savedSynthesize;
            window.setTimeout = savedTimeout;
            backgroundSpeech = savedBackground;
          }
        });

        await test('GPU model selection checks half-precision support', async () => {
          const supported = { requestAdapter: async () => ({ features: new Set(['shader-f16']) }) };
          const unsupported = { requestAdapter: async () => ({ features: new Set() }) };
          assert(await preferredGpuDtype(supported, null) === 'fp16', 'A compatible GPU did not select the faster model');
          assert(await preferredGpuDtype(unsupported) === 'q8' && await preferredGpuDtype(null) === 'q8', 'An incompatible GPU did not use the standard model');
          assert(await preferredGpuDtype(supported, { saveData: true }) === 'q8', 'Data saver did not select the smaller model');
        });

        await test('Generated speech is reused only for the same text and voice', async () => {
          const savedGetEngine = getVoiceEngine;
          const buffer = { length: 10, numberOfChannels: 1, getChannelData: () => new Float32Array(10) };
          let generations = 0;
          try {
            speechCache.clear();
            speechCacheBytes = 0;
            getVoiceEngine = async () => ({
              setup: async () => {},
              synthesize: async () => {
                generations++;
                return [{ type: 'audio', data: { audio: buffer } }];
              }
            });
            await originalSynthesize('CACHE TEST', 'bm_george', {}, playbackGeneration, 'controller');
            await originalSynthesize('CACHE TEST', 'bm_george', {}, playbackGeneration, 'controller');
            assert(generations === 1, 'Repeated speech was generated again');
            await originalSynthesize('CACHE TEST', 'bf_emma', {}, playbackGeneration, 'pilot');
            await originalSynthesize('OTHER TEST', 'bm_george', {}, playbackGeneration, 'controller');
            assert(generations === 3, 'Speech cache mixed voices or message text');
            speechCache.clear();
            speechCacheBytes = 0;
            const large = { length: Math.floor(SPEECH_CACHE_LIMIT / 8), numberOfChannels: 1, getChannelData: () => new Float32Array(0) };
            cacheSpeech('FIRST', 'bm_george', [large]);
            cacheSpeech('SECOND', 'bm_george', [large]);
            cachedSpeech('FIRST', 'bm_george');
            cacheSpeech('THIRD', 'bm_george', [large]);
            assert(cachedSpeech('FIRST', 'bm_george') && !cachedSpeech('SECOND', 'bm_george') && speechCacheBytes <= SPEECH_CACHE_LIMIT, 'Speech cache did not evict its least-recently-used entry');
          } finally {
            speechCache.clear();
            speechCacheBytes = 0;
            getVoiceEngine = savedGetEngine;
          }
        });

        await test('Voice status changes from download to generation', async () => {
          const originalGetVoiceEngine = getVoiceEngine;
          try {
            getVoiceEngine = async () => {
              setVoiceFeedback('Downloading independent voice data: 85 MB received.');
              return {
                setup: async () => {},
                synthesize: async () => [{ type: 'audio', data: { audio: {} } }]
              };
            };
            await originalSynthesize('TEST', selectedVoice, {}, playbackGeneration, 'controller');
            assert(document.getElementById('voice-feedback').textContent.startsWith('Generating controller audio'), 'Download status remained after the voice engine was ready');
          } finally {
            getVoiceEngine = originalGetVoiceEngine;
          }
        });

        await test('Voice setup allows model initialization after download progress', async () => {
          const moduleURL = new URL(VOICE_ENGINE_URL, document.baseURI);
          const { HeadTTS } = await import(moduleURL.href);
          const savedWorker = window.Worker;
          const savedSetTimeout = window.setTimeout;
          const savedClearTimeout = window.clearTimeout;
          let now = 0;
          let nextTimer = 0;
          let workerURL;
          let workerCleared = false;
          const timers = new Map();
          class FakeWorker {
            constructor(url, options) {
              void options.type;
              if (url !== 'blob://') workerURL = new URL(url);
            }
            postMessage(message) {
              if (message.type === 'clear') {
                workerCleared = true;
                return;
              }
              if (message.type !== 'connect') return;
              this.onmessage({ data: { type: 'progress', data: { loaded: 1, total: 1, lengthComputable: true } } });
              now += 15000;
              for (const [id, timer] of [...timers]) {
                if (timer.at <= now) {
                  timers.delete(id);
                  timer.callback();
                }
              }
              this.onmessage({ data: { type: 'ready' } });
            }
            terminate() {}
          }
          try {
            window.Worker = FakeWorker;
            window.setTimeout = (callback, delay) => {
              const id = ++nextTimer;
              timers.set(id, { callback, at: now + delay });
              return id;
            };
            window.clearTimeout = id => timers.delete(id);
            const engine = new HeadTTS({ endpoints: ['wasm'], audioCtx: {}, languages: [], voices: [] });
            await engine.connect(null, () => {});
            assert(engine.isConnected, 'Voice setup timed out while the model was initializing');
            assert(workerURL.search === moduleURL.search, 'Voice worker did not inherit the engine cache version');
            engine.clear();
            assert(workerCleared, 'Clearing speech did not clear the worker queue');
          } finally {
            window.Worker = savedWorker;
            window.setTimeout = savedSetTimeout;
            window.clearTimeout = savedClearTimeout;
          }
        });

        await test('Failed accelerated speech retries with the CPU voice engine', async () => {
          const savedGetVoiceEngine = getVoiceEngine;
          const savedEngine = voiceEngine;
          const savedBackend = voiceEngineBackend;
          const savedPromise = voiceEnginePromise;
          const savedWarn = console.warn;
          const audio = {};
          let cleared = false;
          let terminated = false;
          let cpuAttempts = 0;
          const gpu = {
            setup: async () => {},
            synthesize: async () => [{ type: 'error', data: { error: 'GPU inference failed' } }],
            clear: () => { cleared = true; },
            ww: { terminate: () => { terminated = true; } }
          };
          const cpu = {
            setup: async () => {},
            synthesize: async () => [{ type: 'audio', data: { audio } }]
          };
          try {
            console.warn = () => {};
            getVoiceEngine = async (context, cpuOnly = false) => {
              if (cpuOnly) cpuAttempts++;
              voiceEngine = cpuOnly ? cpu : gpu;
              voiceEngineBackend = cpuOnly ? 'wasm' : 'webgpu';
              return voiceEngine;
            };
            const result = await originalSynthesize('TEST', selectedVoice, {}, playbackGeneration, 'controller');
            assert(result.length === 1 && result[0] === audio, 'CPU retry did not generate audio');
            assert(cleared && terminated && cpuAttempts === 1, 'Failed GPU worker was not replaced exactly once');
            cpu.synthesize = async () => [{ type: 'error', data: { error: 'CPU inference failed' } }];
            let failure;
            try {
              await originalSynthesize('TEST', selectedVoice, {}, playbackGeneration, 'controller');
            } catch (error) {
              failure = error.message;
            }
            assert(failure === 'CPU inference failed', 'CPU failure was not surfaced');
          } finally {
            getVoiceEngine = savedGetVoiceEngine;
            voiceEngine = savedEngine;
            voiceEngineBackend = savedBackend;
            voiceEnginePromise = savedPromise;
            console.warn = savedWarn;
          }
        });

        await test('Unsupported half-precision initialization retries the standard GPU model', async () => {
          const savedWorker = window.Worker;
          const savedPreference = preferredGpuDtype;
          const savedEngine = voiceEngine;
          const savedPromise = voiceEnginePromise;
          const savedBackend = voiceEngineBackend;
          const savedWarn = console.warn;
          const savedGpu = Object.getOwnPropertyDescriptor(navigator, 'gpu');
          const attempts = [];
          class FakeWorker {
            constructor(url, options) { void options.type; }
            postMessage(message) {
              if (message.type !== 'connect') return;
              attempts.push(message.data.dtype);
              queueMicrotask(() => {
                if (message.data.dtype === 'fp16') this.onerror(new Error('unsupported'));
                else this.onmessage({ data: { type: 'ready' } });
              });
            }
            terminate() {}
          }
          try {
            window.Worker = FakeWorker;
            Object.defineProperty(navigator, 'gpu', { configurable: true, value: {} });
            preferredGpuDtype = async () => 'fp16';
            voiceEngine = null;
            voiceEnginePromise = null;
            voiceEngineBackend = null;
            console.warn = () => {};
            const engine = await getVoiceEngine({});
            assert(engine.isConnected && engine.settings.dtypeWebgpu === 'q8' && attempts.join(',') === 'fp16,q8', 'Failed half-precision initialization did not retry q8');
          } finally {
            if (voiceEngine?.ww) voiceEngine.ww.terminate();
            window.Worker = savedWorker;
            if (savedGpu) Object.defineProperty(navigator, 'gpu', savedGpu);
            else delete navigator.gpu;
            preferredGpuDtype = savedPreference;
            voiceEngine = savedEngine;
            voiceEnginePromise = savedPromise;
            voiceEngineBackend = savedBackend;
            console.warn = savedWarn;
          }
        });

        await test('Suspended audio is resumed before playback', async () => {
          let resumed = false;
          let played = false;
          const context = {
            state: 'suspended',
            destination: {},
            resume: async function () { resumed = true; this.state = 'running'; },
            createBufferSource: () => ({
              connect: () => {},
              start() { played = true; queueMicrotask(() => this.onended()); }
            })
          };
          await originalPlayBuffer({}, context, playbackGeneration);
          assert(resumed && played, 'A suspended audio context did not resume and play');
          context.state = 'suspended';
          context.resume = async () => {};
          let failure;
          try {
            await originalPlayBuffer({}, context, playbackGeneration);
          } catch (error) {
            failure = error.message;
          }
          assert(/blocked/i.test(failure), 'Blocked playback was not reported');
        });

        await test('Voice worker reports unexpected synthesis failures', async () => {
          const moduleCode = `
            export const env = {};
            export const LogLevel = { ERROR: 0 };
            export class Tensor {}
            export const StyleTextToSpeech2Model = { from_pretrained: async () => ({}) };
            export const AutoTokenizer = { from_pretrained: async () => () => { throw new Error('test tokenizer failure'); } };
          `;
          const moduleURL = URL.createObjectURL(new Blob([moduleCode], { type: 'text/javascript' }));
          const workerURL = new URL('assets/headtts/modules/worker-tts.mjs', document.baseURI);
          workerURL.search = new URL(VOICE_ENGINE_URL, document.baseURI).search;
          const worker = new Worker(workerURL, { type: 'module' });
          const nextMessage = () => new Promise((resolve, reject) => {
            const timer = setTimeout(() => reject(new Error('Voice worker did not respond')), 10000);
            worker.onmessage = event => { clearTimeout(timer); resolve(event.data); };
            worker.onerror = event => { clearTimeout(timer); reject(new Error(event.message)); };
          });
          try {
            let response = nextMessage();
            worker.postMessage({ type: 'connect', data: {
              transformersModule: moduleURL, model: 'test', device: 'wasm', dtype: 'q8', voices: [], languages: [], trace: 0
            } });
            assert((await response).type === 'ready', 'Test voice worker did not start');
            for (const id of [41, 42]) {
              response = nextMessage();
              worker.postMessage({ type: 'synthesize', id, data: {
                language: 'en-us', input: [{ type: 'phonetic', value: 'hello' }], voice: 'test', speed: 1, audioEncoding: 'wav'
              } });
              const message = await response;
              assert(message.type === 'error' && message.ref === id && /test tokenizer failure/.test(message.data.error), 'Worker did not report the failed request');
            }
          } finally {
            worker.terminate();
            URL.revokeObjectURL(moduleURL);
          }
        });

        await test('Cancelling speech removes queued worker requests', async () => {
          const moduleCode = `
            const originalFetch = self.fetch;
            self.fetch = (url, ...options) => String(url).startsWith('https://voice.invalid/')
              ? new Promise(resolve => setTimeout(() => {
                  self.postMessage({ type: 'test-voice-loaded' });
                  resolve(new Response(new Float32Array(512).buffer));
                }, 20))
              : originalFetch(url, ...options);
            let calls = 0;
            export const env = {};
            export const LogLevel = { ERROR: 0 };
            export class Tensor {}
            export const StyleTextToSpeech2Model = { from_pretrained: async () => async () => {
              const call = ++calls;
              self.postMessage({ type: 'test-inference-start', call });
              if (call === 1) await new Promise(resolve => setTimeout(resolve, 300));
              throw new Error('test inference failure');
            } };
            export const AutoTokenizer = { from_pretrained: async () => () => ({ input_ids: { size: 3 } }) };
          `;
          const moduleURL = URL.createObjectURL(new Blob([moduleCode], { type: 'text/javascript' }));
          const workerURL = new URL('assets/headtts/modules/worker-tts.mjs', document.baseURI);
          workerURL.search = new URL(VOICE_ENGINE_URL, document.baseURI).search;
          const worker = new Worker(workerURL, { type: 'module' });
          const errors = [];
          let preloaded = false;
          let timer;
          try {
            const completed = new Promise((resolve, reject) => {
              timer = setTimeout(() => reject(new Error('Voice worker cancellation timed out')), 10000);
              const send = id => worker.postMessage({ type: 'synthesize', id, data: {
                language: 'en-us', input: [{ type: 'phonetic', value: 'hello' }], voice: 'test', speed: 1, audioEncoding: 'wav'
              } });
              worker.onerror = event => reject(new Error(event.message));
              worker.onmessage = event => {
                const message = event.data;
                if (message.type === 'test-voice-loaded') {
                  preloaded = true;
                } else if (message.type === 'ready') {
                  if (!preloaded) {
                    reject(new Error('Voice worker became ready before the selected voice loaded'));
                    return;
                  }
                  send(1);
                } else if (message.type === 'test-inference-start' && message.call === 1) {
                  send(2);
                  worker.postMessage({ type: 'clear' });
                  send(3);
                } else if (message.type === 'error') {
                  errors.push(message.ref);
                  if (message.ref === 3) resolve();
                }
              };
              worker.postMessage({ type: 'connect', data: {
                transformersModule: moduleURL, model: 'test', device: 'wasm', dtype: 'q8', voices: ['test'], languages: [],
                voiceURL: 'https://voice.invalid/', styleDim: 256, trace: 0
              } });
            });
            await completed;
            assert(errors.join(',') === '1,3', 'A cancelled queued request ran before the new request');
          } finally {
            clearTimeout(timer);
            worker.terminate();
            URL.revokeObjectURL(moduleURL);
          }
        });

        await test('Rendered dialogue and speech use the same speaker order', async () => {
          const pilotFirst = [5, 7, 15, 31, 40, 42, 44, 51, 52, 54, 69, 70];
          for (const card of cards) {
            const id = card.id;
            renderFlashcards([card]);
            const lines = [...document.querySelectorAll('#flashcards-grid [data-speaker]')];

            document.getElementById('deck-json-area').value = JSON.stringify([first, second]);
            importCustomDeck();
            await activeSpeechTask;
            assert(items('vocabulary-collocations').length === 2 && items('vocabulary-nouns').length === 1, 'Imported vocabulary was not deduplicated');
            assert(items('vocabulary-collocations').includes('Request <inspection>') && !document.querySelector('#vocabulary-collocations inspection'), 'Imported vocabulary was not rendered as text');
            assert(radioExamples().length === 2 && radioExamples()[0].textContent.includes('Controller says <inspect>.') && !radioExamples()[0].querySelector('inspect, ready'), 'Imported dialogue examples were not safely rendered');
            resetDefaultDeck();
            await activeSpeechTask;
            assert(items('vocabulary-collocations').length === expected('collocations') && !items('vocabulary-collocations').includes('Request <inspection>'), 'Reset did not refresh the vocabulary list');
            assert(radioExamples().length === cards.length && generalExamples().length === GENERAL_AVIATION_EXAMPLES.length, 'Reset did not refresh the example sections');
          } finally {
            flashcardsData = previousCards;
            if (previousStorage === null) localStorage.removeItem('icao_rtf_cards');
            else localStorage.setItem('icao_rtf_cards', previousStorage);
            input.value = previousSearch;
            renderVocabularyList();
          }
        });

        await test('Scenario sequences include requests and complete readbacks', async () => {
          const filled = line => line.text || line.blanks.reduce((text, blank, index) => text.replace(`{${index}}`, blank.answer), line.template);
          const pushback = SCENARIOS[0].lines;
          const requestIndex = pushback.findIndex(line => line.speaker === 'PILOT' && /request pushback/i.test(filled(line)));
          assert(requestIndex >= 0 && pushback[requestIndex + 1].speaker === 'ATC' && /pushback approved/i.test(filled(pushback[requestIndex + 1])), 'Pushback approval does not follow a request');
          assert(pushback[requestIndex + 2].speaker === 'PILOT' && /pushback approved.*face west/i.test(filled(pushback[requestIndex + 2])), 'Pushback acknowledgement is missing');

          const crossing = SCENARIOS[1].lines;
          assert(crossing[crossing.length - 2].speaker === 'ATC' && /cross runway 09l/i.test(filled(crossing[crossing.length - 2])), 'Crossing clearance missing');
          assert(crossing[crossing.length - 1].speaker === 'PILOT' && /cross runway 09l.*wilco/i.test(filled(crossing[crossing.length - 1])), 'Runway crossing readback missing');

          const emergency = SCENARIOS[2];
          const distress = filled(emergency.lines[0]);
          const clearance = filled(emergency.lines[1]);
          const readback = filled(emergency.lines[2]);
          assert(/^MAYDAY MAYDAY MAYDAY/.test(distress) && /engine fire/i.test(distress), 'Distress call is incomplete');
          assert(/maintain heading 090/i.test(clearance) && /maintain heading 090/i.test(readback) && /three thousand feet/i.test(readback) && /QNH 1014/i.test(readback) && /cleared approach Runway 09R/i.test(readback), 'Emergency clearance readback is incomplete or contradicts the pilot turn');
          assert(/intentions, known position, level and heading/i.test(emergency.note), 'Emergency information guidance missing');

          window.setTimeout = callback => { callback(); return 0; };
          try {
            for (let scenarioIndex = 0; scenarioIndex < SCENARIOS.length; scenarioIndex++) {
              const scenario = SCENARIOS[scenarioIndex];
              loadScenario(scenarioIndex);
              for (let step = 0; step < scenario.lines.length; step++) {
                const line = scenario.lines[step];
                if (line.blanks) {
                  line.blanks.forEach((blank, index) => {
                    const select = document.getElementById(`sc-sel-${step}-${index}`);
                    select.value = index === 0 ? blank.options.find(option => option !== blank.answer) : blank.answer;
                    select.dispatchEvent(new Event('change'));
                  });
                  checkCurrentScenarioStep();
                  await activeSpeechTask;
                  assert(currentScenarioStep === step && /INCORRECT SELECTION/.test(document.getElementById('scenario-feedback').innerText), `Wrong answer advanced scenario ${scenarioIndex}`);
                  line.blanks.forEach((blank, index) => {
                    const select = document.getElementById(`sc-sel-${step}-${index}`);
                    select.value = blank.answer;
                    select.dispatchEvent(new Event('change'));
                  });
                }
                checkCurrentScenarioStep();
                await activeSpeechTask;
                if (step < scenario.lines.length - 1) {
                  assert(currentScenarioStep === step + 1, `Correct answer did not advance scenario ${scenarioIndex}`);
                } else {
                  assert(/SCENARIO COMPLETED/.test(document.getElementById('scenario-feedback').innerText), `Scenario ${scenarioIndex} did not complete`);
                }
              }
            }
          } finally {
            window.setTimeout = originalTimeout;
          }
        });

        await test('Scenario trials rotate and preserve clearance details', () => {
          const savedRandom = Math.random;
          const savedStop = stopVoicePlayback;
          const savedBusy = voiceBusy;
          const original = JSON.stringify(SCENARIOS);
          const filled = line => line.text || line.blanks.reduce((text, blank, index) => text.replace(`{${index}}`, blank.answer), line.template);
          try {
            assert(SCENARIOS.length >= 20, 'The scenario bank does not cover the expected range of operations');
            for (const scenario of SCENARIOS) {
              assert(scenario.lines.some(line => line.speaker === 'PILOT') && scenario.lines.some(line => line.speaker === 'ATC'), `${scenario.title} lacks a pilot or controller`);
              assert(scenario.lines.some(line => line.blanks?.length), `${scenario.title} has no interactive choice`);
              for (const line of scenario.lines) {
                if (!line.blanks) continue;
                for (const blank of line.blanks) {
                  assert(blank.options.includes(blank.answer) && new Set(blank.options).size === blank.options.length, `${scenario.title} has invalid answer options`);
                }
                assert(!/\{\d+\}/.test(filled(line)), `${scenario.title} has an unresolved message`);
              }
            }
            const line = (title, index) => filled(SCENARIOS.find(scenario => scenario.title === title).lines[index]);
            assert(/runway 36.*line up and wait/i.test(line('Line Up and Takeoff', 2)) && /runway 36.*cleared for takeoff/i.test(line('Line Up and Takeoff', 4)), 'Line-up or takeoff runway readback is incomplete');
            assert(/runway 27.*qnh 1013/i.test(line('Taxi to the Holding Point', 2)), 'Taxi or QNH readback is incomplete');
            assert(/heading 090.*flight level 140/i.test(line('Heading and Descent', 1)), 'Heading or level readback is incomplete');
            assert(/star.*four thousand feet.*qnh 1012/i.test(line('Descend via STAR and QNH', 1)), 'STAR level or QNH readback is incomplete');
            assert(/ils approach runway 27r/i.test(line('ILS Approach and Landing', 1)) && /contact tower 118.1/i.test(line('ILS Approach and Landing', 3)) && /runway 27r.*cleared to land/i.test(line('ILS Approach and Landing', 6)), 'Approach, frequency or landing runway readback is incomplete');
            assert(/^PAN PAN, PAN PAN, PAN PAN/i.test(line('Urgency: Medical Assistance', 0)), 'Urgency signal was not repeated three times');
            Math.random = () => 0;
            loadScenario(0);
            const previous = currentScenarioIdx;
            startNewScenario();
            assert(currentScenarioIdx !== previous && Number(document.getElementById('scenario-selector').value) === currentScenarioIdx, 'New scenario did not select a different exercise');
            const second = currentScenarioIdx;
            startNewScenario();
            assert(currentScenarioIdx !== second, 'Consecutive scenario trials did not vary');
            let stopped = false;
            voiceBusy = true;
            stopVoicePlayback = () => { stopped = true; voiceBusy = false; };
            loadScenario(3);
            assert(stopped && currentScenario.title === SCENARIOS[3].title && currentScenarioStep === 0, 'Manual scenario selection did not stop old audio or reset');
            assert(JSON.stringify(SCENARIOS) === original, 'Shuffling trial choices changed the scenario bank');
          } finally {
            Math.random = savedRandom;
            stopVoicePlayback = savedStop;
            voiceBusy = savedBusy;
          }
        });

        await test('Scenario audio uses the selected speaker voices', async () => {
          loadScenario(0);
          spoken.length = 0;
          speakLineContent(0);
          await activeSpeechTask;
          assert(spoken.length === 1 && spoken[0].voice === selectedPilotVoice, 'Pilot scenario line used the wrong voice');
          spoken.length = 0;
          speakLineContent(1);
          await activeSpeechTask;
          assert(spoken.length === 1 && spoken[0].voice === selectedVoice, 'Controller scenario line used the wrong voice');
          currentScenarioStep = 1;
          renderScenarioView();
          const choice = document.getElementById('sc-sel-1-0');
          choice.value = 'DIRECT RWY';
          choice.dispatchEvent(new Event('change'));
          spoken.length = 0;
          speakLineContent(1);
          await activeSpeechTask;
          assert(spoken.length === 1 && spoken[0].text.includes('DIRECT RWY'), 'Scenario audio ignored the selected answer');
        });

        await test('New playback cancels stale audio and errors are visible', async () => {
          const savedSynthesize = synthesizeTurn;
          const savedConsoleError = console.error;
          let release;
          let started;
          const waiting = new Promise(resolve => { started = resolve; });
          try {
            synthesizeTurn = (text, voice) => text === 'OLD'
              ? new Promise(resolve => { release = () => resolve([{ text, voice }]); started(); })
              : Promise.resolve([{ text, voice }]);
            spoken.length = 0;
            const oldTask = speakICAOText('OLD');
            await waiting;
            await speakICAOText('NEW', 'PILOT');
            release();
            await oldTask;
            assert(spoken.length === 1 && spoken[0].text === 'NEW' && spoken[0].voice === selectedPilotVoice, 'Cancelled speech was played');

            let stopRelease;
            let stopStarted;
            const stopWaiting = new Promise(resolve => { stopStarted = resolve; });
            synthesizeTurn = (text, voice) => new Promise(resolve => {
              stopRelease = () => resolve([{ text, voice }]);
              stopStarted();
            });
            spoken.length = 0;
            const stoppedTask = speakICAOText('WAIT');
            await stopWaiting;
            assert(!document.getElementById('voice-stop-button').classList.contains('hidden'), 'Stop control was not shown');
            stopVoicePlayback();
            stopRelease();
            await stoppedTask;
            assert(spoken.length === 0 && document.getElementById('voice-stop-button').classList.contains('hidden') && document.getElementById('voice-feedback').textContent.includes('Audio stopped'), 'Stop did not cancel pending speech');

            console.error = () => {};
            synthesizeTurn = async () => { throw new Error('test failure'); };
            await speakICAOText('Test');
            assert(document.getElementById('voice-feedback').textContent.includes('Voice playback failed'), 'Speech failure was not shown');
            assert(nativeCalls === 0, 'Playback fell back to a removed provider voice');
          } finally {
            synthesizeTurn = savedSynthesize;
            console.error = savedConsoleError;
          }
        });

        await test('Collocations are reachable and distinguish radio from general English', () => {
          switchTab('collocations');
          const section = document.getElementById('section-collocations');
          assert(!section.classList.contains('hidden') && document.getElementById('section-flashcards').classList.contains('hidden'), 'Collocations tab did not open');
          assert(section.textContent.includes('Radiotelephony examples') && section.textContent.includes('General aviation English'), 'Collocation categories are missing');
          switchTab('matching');
          assert(!document.getElementById('section-matching').classList.contains('hidden') && document.querySelectorAll('#matching-phrases button').length > 0, 'Matching tab no longer opens');
          switchTab('quiz');
          assert(!document.getElementById('section-quiz').classList.contains('hidden') && document.querySelector('#quiz-card-container button'), 'Quiz tab no longer opens');
        });

        let preview;
        try {
          const response = await fetch('assets/radar-preview.png');
          if (!response.ok) throw new Error(`Image returned HTTP ${response.status}`);
          const blob = await response.blob();
          const url = URL.createObjectURL(blob);
          try {
            const image = new Image();
            await new Promise((resolve, reject) => {
              image.onload = resolve;
              image.onerror = () => reject(new Error('Preview image could not be decoded'));
              image.src = url;
            });
            preview = { width: image.naturalWidth, height: image.naturalHeight, bytes: blob.size, type: blob.type };
          } finally {
            URL.revokeObjectURL(url);
          }
        } catch (error) {
          preview = { error: error.message };
        }
        await test('LinkedIn metadata references a suitable radar preview', () => {
          const property = name => document.querySelector(`meta[property="${name}"]`)?.content;
          assert(!preview.error, preview.error);
          assert(property('og:title') && property('og:description'), 'Share title or description missing');
          const site = new URL(property('og:url'));
          const imageURL = new URL(property('og:image'));
          const expectedImage = new URL('assets/radar-preview.png', site);
          assert(site.protocol === 'https:' && imageURL.origin === expectedImage.origin && imageURL.pathname === expectedImage.pathname && imageURL.searchParams.has('v'), 'Share image URL is not absolute, versioned or matched to the site');
          assert(property('og:image:type') === 'image/png' && preview.type.startsWith('image/png'), 'Share image is not a PNG');
          assert(preview.width >= 1200 && preview.height >= 627 && preview.bytes <= 5 * 1024 * 1024, 'Share image does not meet LinkedIn dimensions or size');
          assert(Number(property('og:image:width')) === preview.width && Number(property('og:image:height')) === preview.height, 'Share image metadata dimensions are incorrect');
          assert(/pilot/i.test(property('og:image:alt')) && /headset/i.test(property('og:image:alt')) && /radar/i.test(property('og:image:alt')), 'Share image alternative text is incomplete');
        });

        await test('Page header displays the LinkedIn pilot and radar image', async () => {
          const headerImage = document.querySelector('header img');
          const shareImage = new URL(document.querySelector('meta[property="og:image"]').content);
          const expectedImage = new URL(`assets/radar-preview.png${shareImage.search}`, document.baseURI);
          assert(headerImage && headerImage.src === expectedImage.href, 'Header is not using the versioned share image');
          assert(/pilot/i.test(headerImage.alt) && /headset/i.test(headerImage.alt) && /radar/i.test(headerImage.alt), 'Header image alternative text is incomplete');
          await headerImage.decode();
          assert(headerImage.naturalWidth === preview.width && headerImage.naturalHeight === preview.height, 'Header image could not be decoded');
        });

        await test('Shield logo appears beside the title and in the browser tab', async () => {
          const logo = document.querySelector('header h1 [data-shield-logo]');
          const icon = document.querySelector('link[rel="icon"]');
          const expected = new URL('assets/shield-logo.svg', document.baseURI).href;
          assert(logo && logo.src === expected && /shield/i.test(logo.alt), 'Title shield logo is missing');
          assert(icon && icon.href === expected && icon.type === 'image/svg+xml', 'Browser tab does not use the shield logo');
          await logo.decode();
          assert(logo.naturalWidth > 0 && logo.naturalHeight > 0, 'Shield logo could not be decoded');
        });
      } finally {
        playbackGeneration++;
        if (synthesis) synthesis.speak = originalNativeSpeak;
        activateAudio = originalActivate;
        synthesizeTurn = originalSynthesize;
        playAudioBuffer = originalPlayBuffer;
        selectedVoice = originalControllerVoice;
        selectedPilotVoice = originalPilotVoice;
        populateVoices();
        window.alert = originalAlert;
        window.setTimeout = originalTimeout;
        flashcardsData = originalCards;
        if (originalStorage === null) localStorage.removeItem('icao_rtf_cards');
        else localStorage.setItem('icao_rtf_cards', originalStorage);
        category.value = originalCategory;
        search.value = originalSearch;
        switchTab('flashcards');
        filterFlashcards();
      }
      return results;
    }

    document.getElementById('app').addEventListener('load', async () => {
      const output = document.getElementById('results');
      try {
        const run = document.getElementById('app').contentWindow.eval(`(${runTests.toString()})`);
        const results = await run();
        const failures = results.filter(result => !result.passed);
        output.textContent = results.map(result => `${result.passed ? 'PASS' : 'FAIL'} ${result.name}${result.error ? ': ' + result.error : ''}`).join('\n');
        output.textContent += `\n\n${results.length - failures.length}/${results.length} passed`;
        document.title = failures.length ? 'Dialogue tests failed' : 'Dialogue tests passed';
      } catch (error) {
        output.textContent = `Unable to run tests: ${error.message}`;
        document.title = 'Dialogue tests failed';
      }
    });
  </script>
</body>
</html>
