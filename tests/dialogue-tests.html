<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Dialogue regression tests</title>
</head>
<body>
  <h1>Dialogue regression tests</h1>
  <pre id="results">Running...</pre>
  <iframe id="app" src="../index.html" hidden></iframe>
  <script>
    async function runTests() {
      const results = [];
      const assert = (condition, message) => {
        if (!condition) throw new Error(message);
      };
      const test = async (name, fn) => {
        try {
          await fn();
          results.push({ name, passed: true });
        } catch (error) {
          results.push({ name, passed: false, error: error.message });
        }
      };
      const cards = DEFAULT_FLASHCARDS;
      const findCard = id => cards.find(card => card.id === id);
      const synthesis = window.speechSynthesis;
      const originalNativeSpeak = synthesis && synthesis.speak;
      const originalActivate = activateAudio;
      const originalSynthesize = synthesizeTurn;
      const originalPlayBuffer = playAudioBuffer;
      const originalControllerVoice = selectedVoice;
      const originalPilotVoice = selectedPilotVoice;
      const originalAlert = window.alert;
      const originalTimeout = window.setTimeout;
      const originalCards = flashcardsData;
      const originalStorage = localStorage.getItem('icao_rtf_cards');
      const category = document.getElementById('flashcard-category');
      const search = document.getElementById('flashcard-search');
      const originalCategory = category.value;
      const originalSearch = search.value;
      const spoken = [];
      const alerts = [];
      let nativeCalls = 0;

      if (synthesis) synthesis.speak = () => { nativeCalls++; };
      activateAudio = () => Promise.resolve({});
      synthesizeTurn = async (text, voice) => [{ text, voice }];
      playAudioBuffer = async buffer => { spoken.push(buffer); };
      window.alert = message => alerts.push(message);

      try {
        await test('Independent American and British voices are selectable', () => {
          const controller = document.getElementById('voice-select');
          const pilot = document.getElementById('pilot-voice-select');
          for (const select of [controller, pilot]) {
            const options = [...select.options];
            assert(options.length >= 16, 'Independent voice choices are missing');
            assert(options.filter(option => option.textContent.startsWith('American - ')).length >= 8, 'American voices are missing');
            assert(options.filter(option => option.textContent.startsWith('British - ')).length >= 8, 'British voices are missing');
            assert(options.every(option => !/microsoft|google/i.test(option.textContent)), 'A removed provider voice is present');
          }
          controller.value = 'am_michael';
          pilot.value = 'bf_emma';
          onVoiceChanged();
          assert(selectedVoice === 'am_michael' && selectedPilotVoice === 'bf_emma', 'Speaker voice selection was not applied');
          openVoiceSettings();
          assert(!document.getElementById('voice-modal').classList.contains('hidden'), 'Voice settings did not open');
          closeVoiceSettings();
        });

        await test('Independent voice assets are available from the site', async () => {
          const moduleURL = new URL('assets/headtts/modules/headtts.mjs', document.baseURI);
          const module = await import(moduleURL.href);
          assert(typeof module.HeadTTS === 'function', 'Independent voice module could not be loaded');
          for (const path of ['assets/headtts/modules/worker-tts.mjs', 'assets/headtts/modules/language-en-us.mjs', 'assets/headtts/dictionaries/en-us.txt']) {
            const response = await fetch(path);
            assert(response.ok && (await response.arrayBuffer()).byteLength > 0, `Voice asset is unavailable: ${path}`);
          }
        });

        await test('Voice status changes from download to generation', async () => {
          const originalGetVoiceEngine = getVoiceEngine;
          try {
            getVoiceEngine = async () => {
              setVoiceFeedback('Downloading independent voice data: 85 MB received.');
              return {
                setup: async () => {},
                synthesize: async () => [{ type: 'audio', data: { audio: {} } }]
              };
            };
            await originalSynthesize('TEST', selectedVoice, {}, playbackGeneration, 'controller');
            assert(document.getElementById('voice-feedback').textContent.startsWith('Generating controller audio'), 'Download status remained after the voice engine was ready');
          } finally {
            getVoiceEngine = originalGetVoiceEngine;
          }
        });

        await test('Rendered dialogue and speech use the same speaker order', async () => {
          const pilotFirst = [5, 7, 15, 31, 40, 42, 44, 51, 52, 54, 69, 70];
          for (const id of [6, ...pilotFirst]) {
            const card = findCard(id);
            assert(card, `Missing card ${id}`);
            renderFlashcards([card]);
            const lines = [...document.querySelectorAll('#flashcards-grid [data-speaker]')];
            assert(lines[0].dataset.speaker === (id === 6 ? 'ATC' : 'PILOT'), `Wrong first speaker on card ${id}`);
            assert(lines[1].dataset.speaker === (id === 6 ? 'PILOT' : 'ATC'), `Wrong second speaker on card ${id}`);
            if (id === 6) {
              assert(lines.length === 4 && lines[2].dataset.speaker === 'ATC' && lines[3].dataset.speaker === 'PILOT', 'Say-again exchange is incomplete');
            }
            spoken.length = 0;
            document.querySelector('[data-card-action="dialogue"]').click();
            await activeSpeechTask;
            assert(spoken.length === lines.length, `Audio turn count differs on card ${id}`);
            lines.forEach((line, index) => {
              const text = line.textContent.trim().replace(/^(?:ATC|PILOT):\s*"/, '').replace(/"$/, '');
              assert(spoken[index].text === convertTextToICAOSpeech(text), `Audio order or text differs on card ${id}, turn ${index + 1}`);
              assert(spoken[index].voice === (line.dataset.speaker === 'PILOT' ? selectedPilotVoice : selectedVoice), `Wrong speaker voice on card ${id}`);
            });
          }
          assert(convertTextToICAOSpeech('Contact Tower 118.1.').includes('one one eight point one'), 'Frequency decimal is missing from speech');
        });

        await test('Safety-critical flashcard instructions are read back', () => {
          const contains = (text, parts) => parts.every(part => text.toUpperCase().includes(part.toUpperCase()));
          [3, 21, 43].forEach(id => {
            const card = findCard(id);
            const clearance = id === 21 ? 'CLEARED FOR TAKEOFF' : 'CLEARED TO LAND';
            [card.atcLine, card.pilotLine].forEach(text => {
              const upper = text.toUpperCase();
              assert(upper.includes('RUNWAY ZERO NINER') && upper.indexOf('RUNWAY ZERO NINER') < upper.indexOf(clearance), `Runway clearance order is wrong on card ${id}`);
            });
          });
          assert(contains(findCard(8).pilotLine, ['climb', 'one two zero']) && !findCard(8).pilotLine.includes('READ BACK'), 'Card 8 does not read back the clearance');
          assert(contains(findCard(28).pilotLine, ['MERLU 1A', 'AT MERLU', 'one two zero']), 'SID, rejoin point or level missing');
          assert(contains(findCard(30).pilotLine, ['straight ahead', 'three thousand feet']), 'Departure level missing');
          assert(contains(findCard(35).pilotLine, ['ZULU V O R', 'AS PUBLISHED', 'FL120']), 'Published holding pattern or level missing');
          assert(contains(findCard(57).pilotLine, ['niner niner eight', 'HECTOPASCALS']), 'Low QFE units missing');
          assert(contains(findCard(68).pilotLine, ['four thousand', 'QNH 1012']), 'Arrival level or QNH missing');
          assert(contains(findCard(44).followUp[0].text, ['straight ahead', 'three thousand feet']), 'Go-around level readback missing');
          assert(contains(findCard(51).followUp[0].text, ['heading 090', 'three thousand feet']), 'Distress heading or level readback missing');
          assert(contains(findCard(69).followUp[0].text, ['BACKTRACK', 'zero niner Right']), 'Runway backtrack readback missing');
          assert(contains(findCard(54).pilotLine, ['communications restored', 'seven six zero zero']) && !findCard(54).atcLine.includes('observes'), 'Radio failure exchange is not a real transmission');
        });

        await test('Every default card displays its related vocabulary on the dialogue side', () => {
          const previousCards = flashcardsData;
          try {
            flashcardsData = cards;
            category.value = 'ALL';
            search.value = '';
            renderFlashcards(cards);
            const rendered = [...document.querySelectorAll('#flashcards-grid .flip-card')];
            assert(rendered.length === cards.length, 'Not every default card was rendered');
            cards.forEach((card, index) => {
              const back = rendered[index].querySelector('.flip-card-back');
              const section = back.querySelector('[data-vocabulary]');
              const dialogue = back.querySelector('[data-speaker]').parentElement;
              assert(card.collocations.length >= 2 && card.compoundNouns.length >= 1, `Card ${card.id} lacks related vocabulary`);
              assert(dialogue.compareDocumentPosition(section) & Node.DOCUMENT_POSITION_FOLLOWING, `Card ${card.id} vocabulary is not below the dialogue`);
              assert(section.querySelector('[data-collocations]').textContent === card.collocations.join('; '), `Card ${card.id} collocations were not shown`);
              assert(section.querySelector('[data-compound-nouns]').textContent === card.compoundNouns.join('; '), `Card ${card.id} compound nouns were not shown`);
              assert(!section.textContent.includes('(category)') && !section.textContent.includes('(general)'), `Card ${card.id} uses generic vocabulary`);
            });

            search.value = 'comply with published restrictions';
            filterFlashcards();
            assert(document.querySelectorAll('#flashcards-grid .flip-card').length === 1 && document.getElementById('flashcards-grid').textContent.includes('CARD ID: #23'), 'Collocation search did not find the matching card');
            search.value = 'runway designator';
            filterFlashcards();
            assert(document.querySelectorAll('#flashcards-grid .flip-card').length === 1 && document.getElementById('flashcards-grid').textContent.includes('CARD ID: #3'), 'Compound noun search did not find the matching card');
          } finally {
            flashcardsData = previousCards;
            search.value = '';
          }
        });

        await test('Legacy and custom decks round-trip without changing dialogue order', async () => {
          const legacy = { id: 901, cat: 'CUSTOM', phrase: 'Legacy phrase', icaoAudio: 'Legacy audio', meaning: 'Legacy', svgType: 'GENERAL' };
          const custom = {
            id: 902, cat: 'CUSTOM', phrase: 'Pilot "request"', icaoAudio: 'Pilot request', meaning: 'Custom', svgType: 'GENERAL',
            firstSpeaker: 'PILOT', pilotLine: "Pilot's <request>.", atcLine: 'Approved & acknowledged.',
            collocations: ['request <pushback>', 'receive approval'], compoundNouns: ['parking <stand>'],
            followUp: [{ speaker: 'PILOT', text: 'Approved, Pilot.' }]
          };
          const legacyDefault = { ...findCard(15) };
          delete legacyDefault.collocations;
          delete legacyDefault.compoundNouns;
          const stringVocabulary = { ...legacy, id: 903, collocations: 'report a position', compoundNouns: 'position report' };
          const categoryLegacy = { ...legacy, id: 904, cat: 'AIRPORT' };
          const imported = [legacy, custom, legacyDefault, stringVocabulary, categoryLegacy];
          category.value = 'ALL';
          search.value = '';
          document.getElementById('deck-json-area').value = JSON.stringify(imported);
          importCustomDeck();
          await activeSpeechTask;
          assert(flashcardsData.length === 5, 'Legacy deck did not import');
          const legacyLines = [...document.querySelectorAll('.flip-card')][0].querySelectorAll('[data-speaker]');
          assert(legacyLines[0].dataset.speaker === 'ATC' && legacyLines[0].textContent.includes('Legacy phrase'), 'Legacy ATC fallback changed');
          assert(legacyLines[1].dataset.speaker === 'PILOT' && legacyLines[1].textContent.includes('Legacy audio'), 'Legacy pilot fallback changed');
          const legacyVocabulary = [...document.querySelectorAll('.flip-card')][0].querySelector('[data-vocabulary]');
          assert(legacyVocabulary.textContent.includes('Collocations (general)') && legacyVocabulary.textContent.includes('Compound nouns (general)'), 'Legacy vocabulary fallback was not labeled');
          const customCard = [...document.querySelectorAll('.flip-card')][1];
          const customLines = [...customCard.querySelectorAll('[data-speaker]')];
          assert(customLines.map(line => line.dataset.speaker).join(',') === 'PILOT,ATC,PILOT', 'Custom order was not rendered');
          assert(customLines[0].textContent.includes("Pilot's <request>.") && !customLines[0].querySelector('request'), 'Custom text was not rendered as text');
          const customVocabulary = customCard.querySelector('[data-vocabulary]');
          assert(customVocabulary.querySelector('[data-collocations]').textContent === custom.collocations.join('; ') && !customVocabulary.querySelector('pushback'), 'Custom collocations were not rendered as text');
          assert(customVocabulary.querySelector('[data-compound-nouns]').textContent === custom.compoundNouns.join('; ') && !customVocabulary.querySelector('stand'), 'Custom compound nouns were not rendered as text');
          const defaultVocabulary = [...document.querySelectorAll('.flip-card')][2].querySelector('[data-vocabulary]');
          assert(defaultVocabulary.textContent.includes('request pushback') && defaultVocabulary.textContent.includes('parking stand'), 'Older default card did not receive its related vocabulary');
          const stringSection = [...document.querySelectorAll('.flip-card')][3].querySelector('[data-vocabulary]');
          assert(stringSection.textContent.includes('report a position') && stringSection.textContent.includes('position report'), 'String vocabulary was not preserved');
          const categorySection = [...document.querySelectorAll('.flip-card')][4].querySelector('[data-vocabulary]');
          assert(categorySection.textContent.includes('Collocations (category)') && categorySection.textContent.includes('taxi to a holding point'), 'Category vocabulary fallback was not labeled');
          spoken.length = 0;
          customCard.querySelector('[data-card-action="phrase"]').click();
          await activeSpeechTask;
          assert(spoken.length === 1 && spoken[0].text === convertTextToICAOSpeech(custom.icaoAudio) && !customCard.classList.contains('flipped'), 'Custom phrase audio or card interaction changed');
          spoken.length = 0;
          customCard.querySelector('[data-card-action="dialogue"]').click();
          await activeSpeechTask;
          assert(spoken.length === 3 && spoken[0].text === convertTextToICAOSpeech(custom.pilotLine) && !customCard.classList.contains('flipped'), 'Custom dialogue audio or card interaction changed');
          openExportModal();
          const exported = JSON.parse(document.getElementById('deck-json-area').value);
          assert(JSON.stringify(exported) === JSON.stringify(imported), 'Export did not preserve the imported deck');

          document.getElementById('deck-json-area').value = JSON.stringify([{ ...legacy, firstSpeaker: 'INVALID' }]);
          importCustomDeck();
          assert(alerts.some(message => message.includes('firstSpeaker')), 'Invalid speaker order was not reported');
          renderFlashcards([{ ...legacy, compoundNouns: [42] }]);
          assert(document.querySelector('[data-vocabulary]').textContent.includes('invalid deck value'), 'Invalid saved vocabulary was not flagged');
          document.getElementById('deck-json-area').value = JSON.stringify([{ ...legacy, compoundNouns: [42] }]);
          importCustomDeck();
          assert(alerts.some(message => message.includes('compoundNouns')), 'Invalid vocabulary was not reported');
          assert(JSON.stringify(flashcardsData) === JSON.stringify(imported), 'Invalid import replaced the existing deck');
          assert(JSON.stringify(JSON.parse(localStorage.getItem('icao_rtf_cards'))) === JSON.stringify(imported), 'Invalid import replaced saved data');
        });

        await test('Expanded vocabulary and examples follow the current deck and search', async () => {
          const previousCards = flashcardsData;
          const previousStorage = localStorage.getItem('icao_rtf_cards');
          const input = document.getElementById('vocabulary-search');
          const previousSearch = input.value;
          const items = id => [...document.querySelectorAll(`#${id} [data-vocabulary-item]`)].map(item => item.textContent);
          const count = id => document.getElementById(id).textContent;
          try {
            flashcardsData = cards;
            input.value = '';
            switchTab('collocations');
            const expected = field => new Set(cards.flatMap(card => getCardVocabulary(card)[field]).map(item => item.trim().toLowerCase())).size;
            const collocations = items('vocabulary-collocations');
            const nouns = items('vocabulary-nouns');
            const radioExamples = () => [...document.querySelectorAll('#radio-examples [data-radio-example]')];
            const generalExamples = () => [...document.querySelectorAll('#general-examples [data-general-example]')];
            assert(collocations.length === expected('collocations') && collocations.length > 100, 'Default collocations are incomplete');
            assert(nouns.length === expected('compoundNouns') && nouns.length > 70, 'Default compound nouns are incomplete');
            assert(new Set(collocations.map(item => item.toLowerCase())).size === collocations.length, 'Duplicate collocations were displayed');
            assert(collocations.includes('request immediate assistance') && nouns.includes('landing gear'), 'Representative aviation vocabulary is missing');
            assert(count('vocabulary-collocation-count') === `(${collocations.length})` && count('vocabulary-noun-count') === `(${nouns.length})`, 'Vocabulary counts are incorrect');
            assert(radioExamples().length === cards.length && count('radio-example-count') === `(${cards.length})`, 'Flashcard dialogue examples are incomplete');
            assert(generalExamples().length === GENERAL_AVIATION_EXAMPLES.length && generalExamples().length >= 50, 'General English example sentences are incomplete');
            assert(document.getElementById('vocabulary-nouns').compareDocumentPosition(document.getElementById('radio-examples')) & Node.DOCUMENT_POSITION_FOLLOWING, 'Examples do not follow the vocabulary lists');
            const pushbackExample = radioExamples().find(item => item.dataset.cardId === '15');
            assert([...pushbackExample.querySelectorAll('[data-speaker]')].map(item => item.dataset.speaker).join(',') === 'PILOT,ATC,PILOT', 'Example dialogue speaker order changed');
            assert(pushbackExample.textContent.includes(findCard(15).pilotLine) && pushbackExample.textContent.includes('pushback request'), 'Example dialogue or related vocabulary is missing');
            assert(generalExamples().some(item => item.textContent.includes('file a flight plan') && item.textContent.includes('filed a flight plan')) && generalExamples().some(item => item.textContent.includes('flight level') && item.textContent.includes('Compound noun')), 'General collocation or compound noun examples are missing');

            input.value = 'PUSHBACK';
            input.dispatchEvent(new Event('input'));
            const filtered = [...items('vocabulary-collocations'), ...items('vocabulary-nouns')];
            assert(filtered.length >= 3 && filtered.every(item => item.toLowerCase().includes('pushback')), 'Vocabulary search is not case-insensitive');
            assert(radioExamples().length >= 2 && radioExamples().every(item => item.textContent.toLowerCase().includes('pushback')), 'Radio examples did not follow search');
            assert(generalExamples().length > 0 && generalExamples().every(item => item.textContent.toLowerCase().includes('pushback')), 'General examples did not follow search');
            input.value = 'runway designator';
            input.dispatchEvent(new Event('input'));
            assert(radioExamples().some(item => item.dataset.cardId === '3') && generalExamples().some(item => item.textContent.includes('runway designator')), 'Compound noun did not find related examples');
            input.value = 'mandatory instruction';
            input.dispatchEvent(new Event('input'));
            assert(radioExamples().some(item => item.dataset.cardId === '12' && item.textContent.includes('Mandatory instruction')), 'Radio example explanation was not searchable');
            input.value = 'before boarding';
            input.dispatchEvent(new Event('input'));
            assert(generalExamples().length === 1 && generalExamples()[0].textContent.includes('pre-flight inspection'), 'Example sentence text was not searchable');
            input.value = 'no-such-vocabulary-term';
            input.dispatchEvent(new Event('input'));
            assert(items('vocabulary-collocations').length === 0 && items('vocabulary-nouns').length === 0, 'Unmatched vocabulary was displayed');
            assert(count('vocabulary-collocation-count') === '(0)' && document.getElementById('vocabulary-nouns').textContent.includes('No matching terms.'), 'Empty search state is missing');
            assert(radioExamples().length === 0 && generalExamples().length === 0 && count('radio-example-count') === '(0)' && document.getElementById('general-examples').textContent.includes('No matching examples.'), 'Empty example state is missing');

            input.value = '';
            input.dispatchEvent(new Event('input'));
            const first = { id: 910, cat: 'CUSTOM', phrase: 'First', icaoAudio: 'First', meaning: 'First', svgType: 'GENERAL', atcLine: 'Controller says <inspect>.', pilotLine: 'Pilot reports <ready>.', collocations: ['Request <inspection>', 'request <inspection>'], compoundNouns: ['inspection request'] };
            const second = { id: 911, cat: 'CUSTOM', phrase: 'Second', icaoAudio: 'Second', meaning: 'Second', svgType: 'GENERAL', collocations: ['REQUEST <INSPECTION>', 'conduct a briefing'], compoundNouns: ['Inspection request'] };
            category.value = 'ALL';
            search.value = '';
            document.getElementById('deck-json-area').value = JSON.stringify([first, second]);
            importCustomDeck();
            await activeSpeechTask;
            assert(items('vocabulary-collocations').length === 2 && items('vocabulary-nouns').length === 1, 'Imported vocabulary was not deduplicated');
            assert(items('vocabulary-collocations').includes('Request <inspection>') && !document.querySelector('#vocabulary-collocations inspection'), 'Imported vocabulary was not rendered as text');
            assert(radioExamples().length === 2 && radioExamples()[0].textContent.includes('Controller says <inspect>.') && !radioExamples()[0].querySelector('inspect, ready'), 'Imported dialogue examples were not safely rendered');
            resetDefaultDeck();
            await activeSpeechTask;
            assert(items('vocabulary-collocations').length === expected('collocations') && !items('vocabulary-collocations').includes('Request <inspection>'), 'Reset did not refresh the vocabulary list');
            assert(radioExamples().length === cards.length && generalExamples().length === GENERAL_AVIATION_EXAMPLES.length, 'Reset did not refresh the example sections');
          } finally {
            flashcardsData = previousCards;
            if (previousStorage === null) localStorage.removeItem('icao_rtf_cards');
            else localStorage.setItem('icao_rtf_cards', previousStorage);
            input.value = previousSearch;
            renderVocabularyList();
          }
        });

        await test('Scenario sequences include requests and complete readbacks', async () => {
          const filled = line => line.text || line.blanks.reduce((text, blank, index) => text.replace(`{${index}}`, blank.answer), line.template);
          const pushback = SCENARIOS[0].lines;
          const requestIndex = pushback.findIndex(line => line.speaker === 'PILOT' && /request pushback/i.test(filled(line)));
          assert(requestIndex >= 0 && pushback[requestIndex + 1].speaker === 'ATC' && /pushback approved/i.test(filled(pushback[requestIndex + 1])), 'Pushback approval does not follow a request');
          assert(pushback[requestIndex + 2].speaker === 'PILOT' && /pushback approved.*face west/i.test(filled(pushback[requestIndex + 2])), 'Pushback acknowledgement is missing');

          const crossing = SCENARIOS[1].lines;
          assert(crossing[crossing.length - 2].speaker === 'ATC' && /cross runway 09l/i.test(filled(crossing[crossing.length - 2])), 'Crossing clearance missing');
          assert(crossing[crossing.length - 1].speaker === 'PILOT' && /cross runway 09l.*wilco/i.test(filled(crossing[crossing.length - 1])), 'Runway crossing readback missing');

          const emergency = SCENARIOS[2];
          const distress = filled(emergency.lines[0]);
          const readback = filled(emergency.lines[2]);
          assert(/^MAYDAY MAYDAY MAYDAY/.test(distress) && /engine fire/i.test(distress), 'Distress call is incomplete');
          assert(/heading 090/i.test(readback) && /three thousand feet/i.test(readback) && /QNH 1014/i.test(readback) && /cleared approach Runway 09R/i.test(readback), 'Emergency clearance readback is incomplete');
          assert(/known position, intentions/i.test(emergency.note), 'Emergency information guidance missing');

          window.setTimeout = callback => { callback(); return 0; };
          try {
            for (let scenarioIndex = 0; scenarioIndex < SCENARIOS.length; scenarioIndex++) {
              const scenario = SCENARIOS[scenarioIndex];
              loadScenario(scenarioIndex);
              for (let step = 0; step < scenario.lines.length; step++) {
                const line = scenario.lines[step];
                if (line.blanks) {
                  line.blanks.forEach((blank, index) => {
                    const select = document.getElementById(`sc-sel-${step}-${index}`);
                    select.value = index === 0 ? blank.options.find(option => option !== blank.answer) : blank.answer;
                    select.dispatchEvent(new Event('change'));
                  });
                  checkCurrentScenarioStep();
                  await activeSpeechTask;
                  assert(currentScenarioStep === step && /INCORRECT SELECTION/.test(document.getElementById('scenario-feedback').innerText), `Wrong answer advanced scenario ${scenarioIndex}`);
                  line.blanks.forEach((blank, index) => {
                    const select = document.getElementById(`sc-sel-${step}-${index}`);
                    select.value = blank.answer;
                    select.dispatchEvent(new Event('change'));
                  });
                }
                checkCurrentScenarioStep();
                await activeSpeechTask;
                if (step < scenario.lines.length - 1) {
                  assert(currentScenarioStep === step + 1, `Correct answer did not advance scenario ${scenarioIndex}`);
                } else {
                  assert(/SCENARIO COMPLETED/.test(document.getElementById('scenario-feedback').innerText), `Scenario ${scenarioIndex} did not complete`);
                }
              }
            }
          } finally {
            window.setTimeout = originalTimeout;
          }
        });

        await test('Scenario audio uses the selected speaker voices', async () => {
          loadScenario(0);
          spoken.length = 0;
          speakLineContent(0);
          await activeSpeechTask;
          assert(spoken.length === 1 && spoken[0].voice === selectedPilotVoice, 'Pilot scenario line used the wrong voice');
          spoken.length = 0;
          speakLineContent(1);
          await activeSpeechTask;
          assert(spoken.length === 1 && spoken[0].voice === selectedVoice, 'Controller scenario line used the wrong voice');
        });

        await test('New playback cancels stale audio and errors are visible', async () => {
          const savedSynthesize = synthesizeTurn;
          const savedConsoleError = console.error;
          let release;
          let started;
          const waiting = new Promise(resolve => { started = resolve; });
          try {
            synthesizeTurn = (text, voice) => text === 'OLD'
              ? new Promise(resolve => { release = () => resolve([{ text, voice }]); started(); })
              : Promise.resolve([{ text, voice }]);
            spoken.length = 0;
            const oldTask = speakICAOText('OLD');
            await waiting;
            await speakICAOText('NEW', 'PILOT');
            release();
            await oldTask;
            assert(spoken.length === 1 && spoken[0].text === 'NEW' && spoken[0].voice === selectedPilotVoice, 'Cancelled speech was played');

            let stopRelease;
            let stopStarted;
            const stopWaiting = new Promise(resolve => { stopStarted = resolve; });
            synthesizeTurn = (text, voice) => new Promise(resolve => {
              stopRelease = () => resolve([{ text, voice }]);
              stopStarted();
            });
            spoken.length = 0;
            const stoppedTask = speakICAOText('WAIT');
            await stopWaiting;
            assert(!document.getElementById('voice-stop-button').classList.contains('hidden'), 'Stop control was not shown');
            stopVoicePlayback();
            stopRelease();
            await stoppedTask;
            assert(spoken.length === 0 && document.getElementById('voice-stop-button').classList.contains('hidden') && document.getElementById('voice-feedback').textContent.includes('Audio stopped'), 'Stop did not cancel pending speech');

            console.error = () => {};
            synthesizeTurn = async () => { throw new Error('test failure'); };
            await speakICAOText('Test');
            assert(document.getElementById('voice-feedback').textContent.includes('Voice playback failed'), 'Speech failure was not shown');
            assert(nativeCalls === 0, 'Playback fell back to a removed provider voice');
          } finally {
            synthesizeTurn = savedSynthesize;
            console.error = savedConsoleError;
          }
        });

        await test('Collocations are reachable and distinguish radio from general English', () => {
          switchTab('collocations');
          const section = document.getElementById('section-collocations');
          assert(!section.classList.contains('hidden') && document.getElementById('section-flashcards').classList.contains('hidden'), 'Collocations tab did not open');
          assert(section.textContent.includes('Radiotelephony examples') && section.textContent.includes('General aviation English'), 'Collocation categories are missing');
          switchTab('matching');
          assert(!document.getElementById('section-matching').classList.contains('hidden') && document.querySelectorAll('#matching-phrases button').length > 0, 'Matching tab no longer opens');
          switchTab('quiz');
          assert(!document.getElementById('section-quiz').classList.contains('hidden') && document.querySelector('#quiz-card-container button'), 'Quiz tab no longer opens');
        });

        let preview;
        try {
          const response = await fetch('assets/radar-preview.png');
          if (!response.ok) throw new Error(`Image returned HTTP ${response.status}`);
          const blob = await response.blob();
          const url = URL.createObjectURL(blob);
          try {
            const image = new Image();
            await new Promise((resolve, reject) => {
              image.onload = resolve;
              image.onerror = () => reject(new Error('Preview image could not be decoded'));
              image.src = url;
            });
            preview = { width: image.naturalWidth, height: image.naturalHeight, bytes: blob.size, type: blob.type };
          } finally {
            URL.revokeObjectURL(url);
          }
        } catch (error) {
          preview = { error: error.message };
        }
        await test('LinkedIn metadata references a suitable radar preview', () => {
          const property = name => document.querySelector(`meta[property="${name}"]`)?.content;
          assert(!preview.error, preview.error);
          assert(property('og:title') && property('og:description'), 'Share title or description missing');
          const site = new URL(property('og:url'));
          const imageURL = new URL(property('og:image'));
          const expectedImage = new URL('assets/radar-preview.png', site);
          assert(site.protocol === 'https:' && imageURL.origin === expectedImage.origin && imageURL.pathname === expectedImage.pathname && imageURL.searchParams.has('v'), 'Share image URL is not absolute, versioned or matched to the site');
          assert(property('og:image:type') === 'image/png' && preview.type.startsWith('image/png'), 'Share image is not a PNG');
          assert(preview.width >= 1200 && preview.height >= 627 && preview.bytes <= 5 * 1024 * 1024, 'Share image does not meet LinkedIn dimensions or size');
          assert(Number(property('og:image:width')) === preview.width && Number(property('og:image:height')) === preview.height, 'Share image metadata dimensions are incorrect');
          assert(/pilot/i.test(property('og:image:alt')) && /headset/i.test(property('og:image:alt')) && /radar/i.test(property('og:image:alt')), 'Share image alternative text is incomplete');
        });

        await test('Page header displays the LinkedIn pilot and radar image', async () => {
          const headerImage = document.querySelector('header img');
          const shareImage = new URL(document.querySelector('meta[property="og:image"]').content);
          const expectedImage = new URL(`assets/radar-preview.png${shareImage.search}`, document.baseURI);
          assert(headerImage && headerImage.src === expectedImage.href, 'Header is not using the versioned share image');
          assert(/pilot/i.test(headerImage.alt) && /headset/i.test(headerImage.alt) && /radar/i.test(headerImage.alt), 'Header image alternative text is incomplete');
          await headerImage.decode();
          assert(headerImage.naturalWidth === preview.width && headerImage.naturalHeight === preview.height, 'Header image could not be decoded');
        });
      } finally {
        playbackGeneration++;
        if (synthesis) synthesis.speak = originalNativeSpeak;
        activateAudio = originalActivate;
        synthesizeTurn = originalSynthesize;
        playAudioBuffer = originalPlayBuffer;
        selectedVoice = originalControllerVoice;
        selectedPilotVoice = originalPilotVoice;
        populateVoices();
        window.alert = originalAlert;
        window.setTimeout = originalTimeout;
        flashcardsData = originalCards;
        if (originalStorage === null) localStorage.removeItem('icao_rtf_cards');
        else localStorage.setItem('icao_rtf_cards', originalStorage);
        category.value = originalCategory;
        search.value = originalSearch;
        switchTab('flashcards');
        filterFlashcards();
      }
      return results;
    }

    document.getElementById('app').addEventListener('load', async () => {
      const output = document.getElementById('results');
      try {
        const run = document.getElementById('app').contentWindow.eval(`(${runTests.toString()})`);
        const results = await run();
        const failures = results.filter(result => !result.passed);
        output.textContent = results.map(result => `${result.passed ? 'PASS' : 'FAIL'} ${result.name}${result.error ? ': ' + result.error : ''}`).join('\n');
        output.textContent += `\n\n${results.length - failures.length}/${results.length} passed`;
        document.title = failures.length ? 'Dialogue tests failed' : 'Dialogue tests passed';
      } catch (error) {
        output.textContent = `Unable to run tests: ${error.message}`;
        document.title = 'Dialogue tests failed';
      }
    });
  </script>
</body>
</html>
